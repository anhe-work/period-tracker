<link rel="apple-touch-startup-image" href="splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)">

<title>经期记录</title>
<script>
// Android safe-area fallback: some Android WebViews don't report safe-area-inset-top correctly
// when status bar is transparent, so we enforce a minimum 24px top padding on Android
(function(){
  var ua = navigator.userAgent.toLowerCase();
  if (ua.indexOf('android') !== -1) {
    try {
      var style = getComputedStyle(document.documentElement);
      var safeTop = style.getPropertyValue('--safe-top') || '';
      var val = parseFloat(safeTop);
      if (!val || val < 20) {
        document.documentElement.style.setProperty('--safe-top', '24px');
      }
    } catch(e) {}
  }
})();
</script>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#E8657A;
  --primary-light:#FCEEF1;
  --primary-dark:#C94B63;
  --primary-gradient:linear-gradient(135deg,#E8657A 0%,#F06292 100%);
  --bg:#FAF5F6;
  --card:#FFFFFF;
  --text:#2D2D2D;
  --text-secondary:#999;
  --text-tertiary:#CCC;
  --border:#F0EBEC;
  --shadow:0 2px 12px rgba(232,101,122,0.08);
  --shadow-lg:0 4px 20px rgba(232,101,122,0.12);
  --radius:16px;
  --radius-sm:10px;
  --header-h:52px;
  --nav-h:56px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --max-w:500px;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  width:100%;
  overflow-wrap:break-word;
  word-wrap:break-word;
}
input,textarea,select,button{font-family:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input[type="date"],input[type="time"]{font-size:16px;-webkit-appearance:none;appearance:none}

/* ===== Layout ===== */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--primary-gradient);color:#fff;
  padding-top:var(--safe-top);
  box-shadow:0 2px 12px rgba(232,101,122,0.25);
}
.header-inner{
  max-width:var(--max-w);margin:0 auto;
  height:var(--header-h);
  display:flex;align-items:center;
  padding:0 4px;position:relative;
}
.header-title{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  -webkit-transform:translate(-50%,-50%);
  font-size:18px;font-weight:600;
  letter-spacing:0.5px;pointer-events:none;
  max-width:calc(100% - 100px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.header-back{
  width:44px;height:44px;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;
  touch-action:manipulation;cursor:pointer;
}
.header-right{width:44px;position:relative;z-index:1;}

.content{
  padding-top:calc(var(--header-h) + var(--safe-top));
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom));
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  z-index:1;
}
body.no-nav .content{padding-bottom:calc(20px + var(--safe-bottom))}
body.no-nav .bottom-nav{display:none}

.page{display:none;max-width:var(--max-w);margin:0 auto;padding:14px 14px 20px}
.page.active{display:block}

/* ===== Bottom Nav ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;
  padding-bottom:var(--safe-bottom);
  box-shadow:0 -2px 12px rgba(0,0,0,0.06);
  border-top:1px solid var(--border);
}
.bottom-nav-inner{
  max-width:var(--max-w);margin:0 auto;
  display:flex;height:var(--nav-h);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--text-secondary);font-size:11px;
  gap:2px;touch-action:manipulation;cursor:pointer;
  transition:color 0.2s;user-select:none;
  -webkit-user-select:none;
}
.nav-item.active{color:var(--primary)}
.nav-item .nav-icon{font-size:21px;line-height:1}
.nav-item .nav-label{font-size:11px}

/* ===== Cards ===== */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;
}
.card-title{
  font-size:14px;font-weight:600;color:var(--text-secondary);
  margin-bottom:12px;display:flex;align-items:center;gap:6px;
}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:13px 24px;border-radius:var(--radius-sm);
  font-size:16px;font-weight:600;min-height:48px;
  touch-action:manipulation;cursor:pointer;transition:opacity 0.15s,transform 0.1s;
  -webkit-user-select:none;user-select:none;
  border:none;width:100%;
}
.btn:active{transform:scale(0.97);opacity:0.85}
.btn-primary{
  background:var(--primary-gradient);color:#fff;
  box-shadow:0 3px 12px rgba(232,101,122,0.3);
}
.btn-secondary{
  background:#fff;color:var(--primary);
  border:2px solid var(--primary);
}
.btn-danger{
  background:#fff;color:#E53935;
  border:2px solid #FFCDD2;
}
.btn-sm{padding:8px 16px;font-size:14px;min-height:36px;width:auto;border-radius:8px}
.btn-block{display:flex;width:100%}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ===== Stats ===== */
.stats-row{display:flex;gap:10px;margin-bottom:4px}
.stat-card{
  flex:1;text-align:center;
  background:var(--card);border-radius:var(--radius-sm);
  padding:14px 8px;box-shadow:var(--shadow);
}
.stat-num{font-size:30px;font-weight:700;color:var(--primary);line-height:1}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:6px}

/* ===== Bleeding Bars ===== */
.bleeding-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bleeding-row:last-child{margin-bottom:0}
.bleeding-name{width:38px;font-size:14px;color:#666;flex-shrink:0;text-align:right}
.bleeding-track{
  flex:1;height:22px;background:#F5F0F1;
  border-radius:11px;overflow:hidden;min-width:60px;
}
.bleeding-fill{
  height:100%;border-radius:11px;
  transition:width 0.4s ease;
  min-width:4px;
}
.bleeding-count{
  width:28px;text-align:right;font-size:15px;
  font-weight:600;color:#333;flex-shrink:0;
}

/* ===== Chips ===== */
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.chip{
  padding:11px 4px;border-radius:var(--radius-sm);
  border:2px solid var(--border);background:#fff;
  font-size:15px;touch-action:manipulation;cursor:pointer;
  transition:all 0.15s;height:52px;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
.chip.selected{
  border-color:var(--primary);
  background:var(--primary-light);
  color:var(--primary-dark);font-weight:600;
}
.chip:active{transform:scale(0.95)}
/* 自定义用品：chip 上可挂删除角标 */
#productGrid .chip{position:relative}
.chip-x{
  position:absolute;top:-6px;right:-5px;
  width:19px;height:19px;border-radius:50%;
  background:#FFEBEE;color:#D32F2F;border:1px solid #fff;
  font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.chip-add{border-style:dashed;border-color:#E8AEB8;color:var(--primary);font-size:14px}
/* 添加自定义用品：归类选择 */
.prod-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod-type{
  text-align:center;padding:10px 4px;border-radius:var(--radius-sm);
  border:2px solid var(--border);background:#fff;font-size:14px;
  cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.prod-type.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);font-weight:600}

/* ===== Symptom Picker (图标网格 · 分组) ===== */
.sym-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px}
.sym-cell{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.sym-cell:active{transform:scale(0.94)}
.sym-ico{
  width:46px;height:46px;border-radius:50%;
  background:#FDECEF;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;line-height:1;
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.sym-lbl{
  font-size:11.5px;line-height:1.25;color:var(--text-secondary);
  text-align:center;word-break:keep-all;
}
.sym-cell.selected .sym-ico{
  background:var(--primary);border-color:#fff;
  box-shadow:0 2px 8px rgba(232,101,122,.4);
}
.sym-cell.selected .sym-lbl{color:var(--primary-dark);font-weight:600}
.sym-add .sym-ico{
  background:#fff;border:1.5px dashed #E8AEB8;color:var(--primary);
  font-size:24px;font-weight:400;
}
.sym-add .sym-lbl{color:var(--primary)}
/* 自定义症状的图标（✚ 是文字符号，默认黑色）统一改成主题粉色；选中时随粉色圆底变白 */
.sym-cell .sym-ico.sym-ico-custom{color:var(--primary);font-size:22px;font-weight:700}
.sym-cell.selected .sym-ico.sym-ico-custom{color:#fff}
.sym-del{
  position:absolute;top:-3px;right:14%;
  width:19px;height:19px;border-radius:50%;
  background:#E8657A;color:#fff;font-size:11px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.sym-group-head{display:flex;justify-content:space-between;align-items:center}
.sym-edit-btn{
  font-size:12px;color:var(--primary);font-weight:500;
  padding:3px 10px;border-radius:999px;border:1px solid var(--primary);
  background:#fff;cursor:pointer;
}
.sym-empty-tip{font-size:12px;color:var(--text-tertiary);text-align:center;padding:2px 0 8px}

/* ===== Bleeding Level Buttons ===== */
.bleeding-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bleeding-btn{
  padding:14px 8px;border-radius:var(--radius-sm);
  border:2px solid var(--border);background:#fff;
  font-size:16px;font-weight:500;text-align:center;
  touch-action:manipulation;cursor:pointer;transition:all 0.15s;
  min-height:52px;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
.bleeding-btn:active{transform:scale(0.96)}
.bleeding-btn.selected{color:#fff;border-width:2px;font-weight:600}
.bleeding-btn.selected[data-bleeding="light"]{background:#FFB0B6;border-color:#FFB0B6}
.bleeding-btn.selected[data-bleeding="medium"]{background:#FF7A85;border-color:#FF7A85}
.bleeding-btn.selected[data-bleeding="heavy"]{background:#E53935;border-color:#E53935}
.bleeding-btn.selected[data-bleeding="very_heavy"]{background:#B71C1C;border-color:#B71C1C}

/* ===== Forms ===== */
.form-group{margin-bottom:18px}
.form-label{
  font-size:14px;font-weight:600;color:#666;
  margin-bottom:8px;display:flex;align-items:center;gap:4px;
}
.form-input{
  width:100%;padding:13px 14px;
  border:2px solid var(--border);border-radius:var(--radius-sm);
  background:#fff;font-size:16px;color:var(--text);
  transition:border-color 0.2s;min-height:48px;
}
.form-input:focus{outline:none;border-color:var(--primary)}
textarea.form-input{resize:none;min-height:72px;line-height:1.5}

/* ===== Symptom Checkboxes ===== */
.symptom-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.symptom-check{
  display:flex;align-items:center;gap:8px;
  padding:13px;border-radius:var(--radius-sm);
  border:2px solid var(--border);background:#fff;
  cursor:pointer;transition:all 0.15s;
  min-height:50px;font-size:15px;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.symptom-check.checked{
  border-color:var(--primary);
  background:var(--primary-light);
  color:var(--primary-dark);font-weight:600;
}
.symptom-check .check-box{
  width:22px;height:22px;border-radius:6px;
  border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;transition:all 0.15s;
}
.symptom-check.checked .check-box{
  background:var(--primary);border-color:var(--primary);
  color:#fff;
}

/* ===== List Items ===== */
.list-item{
  display:flex;align-items:center;
  padding:14px;background:#fff;
  border-radius:var(--radius-sm);margin-bottom:8px;
  box-shadow:var(--shadow);
  touch-action:manipulation;
  transition:transform 0.1s;
}
.list-item:active{transform:scale(0.98)}
.list-item-content{flex:1;min-width:0}
.list-item-title{font-size:15px;font-weight:600;color:var(--text)}
.list-item-sub{font-size:13px;color:var(--text-secondary);margin-top:2px}

/* ===== Day Card ===== */
.day-card{
  background:#fff;border-radius:var(--radius-sm);
  padding:14px;margin-bottom:8px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform 0.1s;
  touch-action:manipulation;
}
.day-card:active{transform:scale(0.98)}
.day-card-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:8px;
}
.day-card-date{font-size:16px;font-weight:600}
.day-card-weekday{font-size:13px;color:var(--text-secondary)}
.day-card-stats{display:flex;gap:8px;flex-wrap:wrap}
.day-stat{
  font-size:13px;padding:4px 10px;
  border-radius:6px;background:var(--primary-light);
  color:var(--primary-dark);font-weight:500;
}
.day-stat.pants{background:#FFF3E0;color:#E65100}
.day-stat.empty{background:#F5F5F5;color:#999}

/* ===== Change Record ===== */
.change-record{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;background:#fff;
  border-radius:var(--radius-sm);margin-bottom:8px;
  box-shadow:var(--shadow);
}
.change-time{
  font-size:16px;font-weight:600;color:var(--primary);
  min-width:48px;
}
.change-info{flex:1;min-width:0}
.change-product{font-size:14px;font-weight:500;color:var(--text)}
.change-bleeding{
  font-size:12px;padding:2px 8px;border-radius:4px;
  display:inline-block;margin-top:2px;font-weight:500;
}
.change-bleeding.light{background:#FFEBEE;color:#C62828}
.change-bleeding.medium{background:#FFCDD2;color:#B71C1C}
.change-bleeding.heavy{background:#EF9A9A;color:#FFF}
.change-bleeding.very_heavy{background:#B71C1C;color:#FFF}
.change-note{font-size:13px;color:var(--text-secondary);margin-top:4px}
.change-delete{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text-tertiary);
  touch-action:manipulation;cursor:pointer;border-radius:8px;
}
.change-delete:active{color:#E53935;background:#FFEBEE}
.change-edit{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text-tertiary);
  touch-action:manipulation;cursor:pointer;border-radius:8px;
}
.change-edit:active{color:var(--primary);background:var(--primary-light)}

/* ===== Empty State ===== */
.empty-state{
  text-align:center;padding:40px 20px;
}
.empty-icon{font-size:56px;margin-bottom:12px}
.empty-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--text-secondary);margin-bottom:20px}

/* ===== Cycle Card (History) ===== */
.cycle-card{
  background:#fff;border-radius:var(--radius);
  padding:16px;margin-bottom:10px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform 0.1s;
  touch-action:manipulation;
}
.cycle-card:active{transform:scale(0.98)}
.cycle-card-header{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:10px;
}
.cycle-num{font-size:16px;font-weight:600;color:var(--text)}
.cycle-badge{
  font-size:12px;padding:3px 10px;border-radius:10px;
  background:var(--primary-light);color:var(--primary-dark);
  font-weight:500;
}
.cycle-badge.ongoing{background:#E8F5E9;color:#2E7D32}
.cycle-dates{font-size:14px;color:var(--text-secondary);margin-bottom:8px}
.cycle-duration{
  display:inline-flex;align-items:baseline;gap:2px;
  background:linear-gradient(135deg,#FFE4E8,#FFF0F3);
  border-radius:10px;padding:4px 12px;margin-bottom:10px;
}
.cycle-duration-num{font-size:20px;font-weight:700;color:#E8657A;line-height:1.2}
.cycle-duration-label{font-size:13px;color:#C06070}
.cycle-stats{display:flex;gap:8px;flex-wrap:wrap}
.cycle-stat{
  font-size:13px;padding:4px 10px;border-radius:6px;
  background:#F5F0F1;color:var(--text);
}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.45);z-index:200;
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:20px;
  max-width:360px;width:100%;
  padding:24px 20px 20px;
}
.modal-title{font-size:18px;font-weight:600;margin-bottom:16px;text-align:center}
.modal-body{margin-bottom:20px}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn{flex:1}

/* ===== Picker Modal (Time & Date) ===== */
.picker-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.45);z-index:250;
  display:none;align-items:flex-end;justify-content:center;
}
.picker-overlay.show{display:flex}
.picker-sheet{
  background:#fff;border-radius:20px 20px 0 0;
  width:100%;max-width:500px;max-height:85vh;
  display:flex;flex-direction:column;
  animation:pickerSlideUp 0.25s ease;
}
@keyframes pickerSlideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.picker-header{
  padding:18px 20px 10px;text-align:center;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.picker-title{font-size:17px;font-weight:600;color:var(--text)}
.picker-display{
  font-size:42px;font-weight:300;color:var(--primary);
  margin-top:6px;letter-spacing:2px;
}
.picker-body{
  flex:1;overflow-y:auto;padding:16px 20px;
  -webkit-overflow-scrolling:touch;
}
.picker-section{margin-bottom:16px}
.picker-section-label{
  font-size:13px;font-weight:600;color:var(--text-secondary);
  margin-bottom:10px;text-align:center;
}
.picker-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.picker-item{
  width:52px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-size:15px;font-weight:500;
  background:#F5F0F1;color:var(--text);
  touch-action:manipulation;cursor:pointer;
  transition:all 0.15s;-webkit-user-select:none;user-select:none;
  border:2px solid transparent;
}
.picker-item:active{transform:scale(0.95)}
.picker-item.selected{
  background:var(--primary-gradient);color:#fff;
  box-shadow:0 3px 10px rgba(232,101,122,0.35);
  border-color:var(--primary-dark);
}
.picker-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.picker-weekday{text-align:center;font-size:12px;color:var(--text-secondary);font-weight:600;padding:6px 0}
.picker-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.picker-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:15px;font-weight:500;
  background:#F5F0F1;color:var(--text);cursor:pointer;
  touch-action:manipulation;transition:all 0.15s;
  -webkit-user-select:none;user-select:none;
}
.picker-day:active{transform:scale(0.9)}
.picker-day.other-month{color:var(--text-tertiary);background:transparent}
.picker-day.today{border:2px solid var(--primary);color:var(--primary)}
.picker-day.selected{
  background:var(--primary-gradient);color:#fff;
  box-shadow:0 3px 10px rgba(232,101,122,0.35);
  border-color:transparent;
}
.picker-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;padding:0 4px;
}
.picker-nav-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--primary-light);color:var(--primary);
  font-size:18px;font-weight:700;cursor:pointer;
  touch-action:manipulation;transition:opacity 0.15s;
  -webkit-user-select:none;user-select:none;
}
.picker-nav-btn:active{opacity:0.6}
.picker-nav-label{font-size:16px;font-weight:600;color:var(--text)}
.picker-actions{
  display:flex;gap:10px;padding:12px 20px 20px;
  border-top:1px solid var(--border);flex-shrink:0;
}
.picker-actions .btn{flex:1}

  padding-right:36px;
}

/* ===== Wheel Time Picker ===== */
.wheel-wrap{
  display:flex;justify-content:center;align-items:center;gap:2px;
  position:relative;padding:0 16px;
}
.wheel-highlight{
  position:absolute;left:16px;right:16px;top:50%;
  transform:translateY(-50%);-webkit-transform:translateY(-50%);
  height:44px;
  background:linear-gradient(135deg,rgba(232,101,122,0.10),rgba(244,143,163,0.10));
  border-radius:14px;pointer-events:none;z-index:0;
  border-top:1.5px solid rgba(232,101,122,0.25);
  border-bottom:1.5px solid rgba(232,101,122,0.25);
}
.wheel-col{
  flex:0 0 76px;height:220px;overflow-y:scroll;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;position:relative;z-index:1;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 28%,#000 72%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 28%,#000 72%,transparent 100%);
}
.wheel-col::-webkit-scrollbar{display:none}
.wheel-spacer{height:88px}
.wheel-item{
  height:44px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:center;font-size:20px;font-weight:500;
  color:var(--text-tertiary);
  transition:font-size 0.15s,color 0.15s,opacity 0.15s;
  -webkit-user-select:none;user-select:none;cursor:pointer;
}
.wheel-item.active{
  color:var(--primary);font-size:26px;font-weight:700;
}
.wheel-sep{
  font-size:30px;font-weight:700;color:var(--primary);
  display:flex;align-items:center;padding:0 4px;z-index:1;
  margin-top:-6px;
}
.wheel-labels{
  display:flex;justify-content:center;gap:80px;
  margin-top:14px;padding-bottom:4px;
}
.wheel-label{
  text-align:center;font-size:13px;
  color:var(--text-secondary);font-weight:600;
}

/* ===== Toast ===== */
.toast-container{
  position:fixed;top:calc(var(--header-h) + var(--safe-top) + 10px);
  left:0;right:0;z-index:300;
  display:flex;justify-content:center;
  pointer-events:none;
}
.toast{
  background:rgba(45,45,45,0.9);color:#fff;
  padding:10px 20px;border-radius:20px;
  font-size:14px;max-width:90%;text-align:center;
  opacity:0;transform:translateY(-10px);
  transition:all 0.3s ease;
  backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translateY(0)}

/* ===== PWA Install Banner ===== */
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(20px)}}

/* ===== Section Title ===== */
.section-title{

}
.calendar-cell{

}

  color:var(--primary-dark);font-weight:600;
}

  color:var(--primary);font-weight:500;
}
.calendar-cell.today .calendar-day-num{

}

}

}
.calendar-cell.has-records{cursor:pointer}

.calendar-dot{
  width:4px;height:4px;border-radius:50%;

}
.calendar-legend{
  display:flex;gap:14px;margin-top:12px;
  font-size:12px;color:var(--text-secondary);
  justify-content:center;flex-wrap:wrap;align-items:center;
}
.calendar-legend span{display:flex;align-items:center;gap:4px}
.calendar-legend-dot{

}
.calendar-legend-dot.period{background:var(--primary-light);border:1px solid var(--primary)}
.calendar-legend-dot.predicted{
  background:repeating-linear-gradient(45deg, #FCEEF1 0px, #FCEEF1 2px, #FFF5F7 2px, #FFF5F7 5px);
  border:1px solid var(--primary);
}
.calendar-today-mark{
  display:inline-block;width:14px;height:14px;
  border-radius:50%;border:2px solid var(--primary);
}

.calendar-cell.menstrual-day{background:#FCEEF1;color:#C94B63}

}

}

/* ===== Responsive ===== */

  .stat-num{font-size:34px}

}

    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
  } catch(e) {}
}

var state = {
  currentPage: 'home',
  pageParams: {},
  data: {cycles: []},
  recordDate: null,
  symptomsDate: null,
  selectedProduct: null,
  selectedBleeding: null,
  selectedSymptomsArr: [],
  navHistory: [],
  symptomsAsSub: false,
  editingCycleId: null,
  editingChangeId: null,
  editingSymptoms: false,
  editingProducts: false,
  justAddedProduct: null,
  calendarYear: 0,
  calendarMonth: 0
};

/* ===== Data Layer ===== */
var LOCALSTORAGE_AVAILABLE = false;
function checkStorage() {
  try {
    var testKey = '__period_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    LOCALSTORAGE_AVAILABLE = true;
  } catch (e) {
    LOCALSTORAGE_AVAILABLE = false;
  }
}
function loadData() {
  if (!LOCALSTORAGE_AVAILABLE) { state.data = {cycles: []}; return; }
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state.data = JSON.parse(raw);
      if (!state.data.cycles || !state.data.cycles.length) {
        state.data = {cycles: []};
      }
      normalizeData();
      migrateSymptomsToDailyLogs();
    }
  } catch (e) {
    state.data = {cycles: []};
  }
  ensureDailyLogs();
}
function saveData() {
  if (!LOCALSTORAGE_AVAILABLE) {
    showToast('存储不可用，数据无法保存');
    return;
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch (e) {
    showToast('保存失败，存储空间可能不足');
  }
}

// 将旧版「每天单条症状对象」迁移为「每天多条症状记录数组」，保证已有数据不丢失
function normalizeData() {
  if (!state.data || !state.data.cycles) return;
  for (var i = 0; i < state.data.cycles.length; i++) {
    var c = state.data.cycles[i];
    if (!c.symptoms) { c.symptoms = {}; continue; }
    for (var date in c.symptoms) {
      var s = c.symptoms[date];
      if (s && !Array.isArray(s)) {
        c.symptoms[date] = [{selected: s.selected || [], custom: s.custom || ''}];
      } else if (Array.isArray(s)) {
        for (var j = 0; j < s.length; j++) {
          if (!s[j] || typeof s[j] !== 'object') s[j] = {selected: [], custom: ''};
          else {
            if (!s[j].selected) s[j].selected = [];
            if (typeof s[j].custom !== 'string') s[j].custom = '';
          }
        }
      }
    }
  }
}

/* ===== 每日记录层（症状/白带等）：按日期独立存储，不依赖出血周期 ===== */
function ensureDailyLogs() {
  if (!state.data.dailyLogs) state.data.dailyLogs = {};
  return state.data.dailyLogs;
}

// 一次性迁移：把旧版挂在出血周期上的症状搬到按日期的 dailyLogs，保证老数据不丢
function migrateSymptomsToDailyLogs() {
  if (!state.data || !state.data.cycles) return;
  ensureDailyLogs();
  var changed = false;
  for (var i = 0; i < state.data.cycles.length; i++) {
    var c = state.data.cycles[i];
    if (!c.symptoms) continue;
    for (var date in c.symptoms) {
      var arr = c.symptoms[date];
      if (!Array.isArray(arr) || arr.length === 0) continue;
      if (!state.data.dailyLogs[date]) state.data.dailyLogs[date] = {symptoms: []};
      if (!state.data.dailyLogs[date].symptoms) state.data.dailyLogs[date].symptoms = [];
      for (var j = 0; j < arr.length; j++) {
        state.data.dailyLogs[date].symptoms.push(arr[j]);
      }
      changed = true;
    }
    c.symptoms = {}; // 清空旧位置，避免重复展示
  }
  if (changed) saveData();
}

function getDaySymptoms(date) {
  if (!state.data.dailyLogs || !state.data.dailyLogs[date]) return [];
  return state.data.dailyLogs[date].symptoms || [];
}

// 当天是否有「非空」记录（只有勾选或备注才算）
function hasDaySymptoms(date) {
  var arr = getDaySymptoms(date);
  for (var i = 0; i < arr.length; i++) {
    var e = arr[i];
    if ((e.selected && e.selected.length > 0) || (e.custom && e.custom.trim() !== '')) return true;
  }
  return false;
}

function saveDaySymptom(date, selected, custom, entryIndex) {
  ensureDailyLogs();
  if (!state.data.dailyLogs[date]) state.data.dailyLogs[date] = {symptoms: []};
  if (!state.data.dailyLogs[date].symptoms) state.data.dailyLogs[date].symptoms = [];
  var list = state.data.dailyLogs[date].symptoms;
  if (typeof entryIndex === 'number' && entryIndex >= 0 && list[entryIndex]) {
    list[entryIndex] = {selected: selected || [], custom: custom || ''};
  } else {
    if ((selected && selected.length > 0) || (custom && custom.trim() !== '')) {
      list.push({selected: selected || [], custom: custom || ''});
    }
  }
  saveData();
}

function deleteDaySymptom(date, index) {
  ensureDailyLogs();
  if (!state.data.dailyLogs[date] || !state.data.dailyLogs[date].symptoms) return;
  var arr = [];
  var list = state.data.dailyLogs[date].symptoms;
  for (var i = 0; i < list.length; i++) {
    if (i !== index) arr.push(list[i]);
  }
  state.data.dailyLogs[date].symptoms = arr;
  saveData();
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function getCurrentCycle() {
  for (var i = state.data.cycles.length - 1; i >= 0; i--) {
    if (!state.data.cycles[i].endDate) return state.data.cycles[i];
  }
  return null;
}

function getCycleById(id) {
  for (var i = 0; i < state.data.cycles.length; i++) {
    if (state.data.cycles[i].id === id) return state.data.cycles[i];
  }
  return null;
}

function createCycle(startDate) {
  var cur = getCurrentCycle();
  if (cur) {
    cur.endDate = dayBefore(startDate);
  }
  var cycle = {id: genId(), startDate: startDate, endDate: null, changes: [], symptoms: {}};
  state.data.cycles.push(cycle);
  saveData();
  return cycle;
}

function endCycle(cycleId, endDate) {
  var c = getCycleById(cycleId);
  if (c) { c.endDate = endDate; saveData(); }
}

function reopenCycle(cycleId) {
  var c = getCycleById(cycleId);
  if (c) { c.endDate = null; saveData(); }
}

function getLastEndedCycle() {
  // 最近一次已结束的出血记录
  var last = null;
  for (var i = state.data.cycles.length - 1; i >= 0; i--) {
    var c = state.data.cycles[i];
    if (c.endDate) {
      if (!last || c.endDate > last.endDate) {
        last = c;
      }
    }
  }
  return last;
}

// 最近一次已结束的【月经】（排除被自动判定为异常出血的记录）
// 用于首页「上次经期刚结束」卡片 —— 否则该卡片可能指向一次异常出血
function getLastEndedPeriodCycle() {
  var cls = classifyCycles();
  var last = null;
  for (var i = 0; i < state.data.cycles.length; i++) {
    var c = state.data.cycles[i];
    if (!c.endDate) continue;
    if (cls[c.id] && cls[c.id] !== 'period') continue;
    if (!last || c.endDate > last.endDate) last = c;
  }
  return last || getLastEndedCycle();
}

function addChange(cycleId, data) {
  var c = getCycleById(cycleId);
  if (c) {
    var item = {id: genId()};
    for (var k in data) { if (data.hasOwnProperty(k)) item[k] = data[k]; }
    c.changes.push(item);
    saveData();
  }
}

function deleteChange(cycleId, changeId) {
  var c = getCycleById(cycleId);
  if (c) {
    var newChanges = [];
    for (var i = 0; i < c.changes.length; i++) {
      if (c.changes[i].id !== changeId) newChanges.push(c.changes[i]);
    }
    c.changes = newChanges;
    saveData();
  }
}

function getChangeById(cycleId, changeId) {
  var c = getCycleById(cycleId);
  if (!c) return null;
  for (var i = 0; i < c.changes.length; i++) {
    if (c.changes[i].id === changeId) return c.changes[i];
  }
  return null;
}

function updateChange(cycleId, changeId, data) {
  var c = getCycleById(cycleId);
  if (!c) return;
  for (var i = 0; i < c.changes.length; i++) {
    if (c.changes[i].id === changeId) {
      for (var k in data) {
        if (data.hasOwnProperty(k)) c.changes[i][k] = data[k];
      }
      saveData();
      return;
    }
  }
}

// 兼容旧签名：症状已改为按日期独立存储，不再挂在出血周期上
function saveSymptoms(cycleId, date, selected, custom, entryIndex) {
  saveDaySymptom(date, selected, custom, entryIndex);
}

function deleteCycle(cycleId) {
  var newCycles = [];
  for (var i = 0; i < state.data.cycles.length; i++) {
    if (state.data.cycles[i].id !== cycleId) newCycles.push(state.data.cycles[i]);
  }
  state.data.cycles = newCycles;
  saveData();
}

/* ===== Utilities ===== */
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function nowTimeStr() {
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function formatDate(s) {
  if (!s) return '';
  var d = new Date(s + 'T00:00:00');
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function formatDateFull(s) {
  if (!s) return '';
  var d = new Date(s + 'T00:00:00');
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function getWeekday(s) {
  if (!s) return '';
  var wd = ['周日','周一','周二','周三','周四','周五','周六'];
  return wd[new Date(s + 'T00:00:00').getDay()];
}

function daysBetween(a, b) {
  var s = new Date(a + 'T00:00:00').getTime();
  var e = new Date(b + 'T00:00:00').getTime();
  return Math.round((e - s) / 86400000) + 1;
}

function dayBefore(s) {
  var d = new Date(s + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function isToday(s) { return s === todayStr(); }

/* 选择器里可选的用品 = 内置 + 用户自建（退役项不出现在选择器） */
function getAllProducts() {
  var list = PRODUCTS.slice();
  var cp = state.data.customProducts || [];
  for (var i = 0; i < cp.length; i++) {
    if (cp[i].retired) continue;
    list.push(cp[i]);
  }
  return list;
}

/* 按 id 取用品：包含退役项，保证历史记录仍能显示原名称 */
function getProductById(id) {
  for (var i = 0; i < PRODUCTS.length; i++) {
    if (PRODUCTS[i].id === id) return PRODUCTS[i];
  }
  var cp = state.data.customProducts || [];
  for (var j = 0; j < cp.length; j++) {
    if (cp[j].id === id) return cp[j];
  }
  return null;
}

/* ===== 自定义用品（用户自建，用于「选择用品」）===== */
var PRODUCT_TYPES = [
  {key:'napkin', label:'卫生巾'},
  {key:'pad',    label:'护垫'},
  {key:'tampon', label:'棉条'},
  {key:'pants',  label:'安睡裤'}
];

function addCustomProduct(label, type) {
  label = (label || '').trim();
  if (!label) return null;
  if (!state.data.customProducts) state.data.customProducts = [];
  // 重名不重复添加
  var exist = getAllProducts();
  for (var i = 0; i < exist.length; i++) {
    if (exist[i].label === label) return exist[i];
  }
  var p = {id: 'cp_' + genId(), label: label, short: label, type: type || 'napkin', custom: true};
  state.data.customProducts.push(p);
  saveData();
  return p;
}

/* 删除自定义用品：已被历史记录引用时改为「退役」（列表里消失，历史仍显示原名称） */
function deleteCustomProduct(id) {
  var used = false;
  for (var ci = 0; ci < state.data.cycles.length; ci++) {
    var chs = state.data.cycles[ci].changes || [];
    for (var k = 0; k < chs.length; k++) {
      if (chs[k].productId === id) { used = true; break; }
    }
    if (used) break;
  }
  var cp = state.data.customProducts || [];
  var arr = [];
  for (var i = 0; i < cp.length; i++) {
    if (cp[i].id !== id) { arr.push(cp[i]); continue; }
    if (used) { cp[i].retired = true; arr.push(cp[i]); }
  }
  state.data.customProducts = arr;
  if (state.selectedProduct === id) state.selectedProduct = PRODUCTS[0].id;
  saveData();
}

function getBleedingById(id) {
  for (var i = 0; i < BLEEDING.length; i++) {
    if (BLEEDING[i].id === id) return BLEEDING[i];
  }
  return null;
}

/* ===== 自定义症状（用户自建，归入「更多症状」）===== */
function getAllSymptoms() {

  var cs = state.data.customSymptoms || [];
  for (var i = 0; i < cs.length; i++) list.push(cs[i]);
  return list;
}

function addCustomSymptom(label) {
  label = (label || '').trim();
  if (!label) return null;

  // 重名不重复添加
  var exist = getAllSymptoms();

    if (exist[i].label === label) return exist[i];
  }
  var s = {id: 'cs_' + genId(), label: label, icon: '✚', group: 'more', custom: true};
  state.data.customSymptoms.push(s);
  saveData();

}

function deleteCustomSymptom(id) {

  var arr = [];
  for (var i = 0; i < cs.length; i++) {
    if (cs[i].id !== id) arr.push(cs[i]);

function getSymptomById(id) {

}

function arrayContains(arr, val) {
  for (var i = 0; i < arr.length; i++) {
    if (arr[i] === val) return true;
  }
  return false;
}

function vibrate() {

  }
}

function showError(msg) {

/* ===== Toast ===== */
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.innerHTML = msg;
  t.className = 'toast show';
  t.style.pointerEvents = 'none';
  if (t._timer) clearTimeout(t._timer);
  t._timer = setTimeout(function() {
    t.className = 'toast';
  }, 2000);
}

function showUndoToast(msg, undoLabel, onUndo) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.innerHTML = msg + ' <span style="color:#FFCC80;font-weight:600;cursor:pointer;pointer-events:auto;text-decoration:underline;white-space:nowrap" id="undoBtn">' + undoLabel + '</span>';
  t.className = 'toast show';
  t.style.pointerEvents = 'auto';
  if (t._timer) clearTimeout(t._timer);
  t._timer = setTimeout(function() {
    t.className = 'toast';
    t.style.pointerEvents = 'none';
  }, 5000);

  var undoEl = document.getElementById('undoBtn');
  if (undoEl) {
    undoEl.onclick = function(e) {
      e.stopPropagation();
      e.preventDefault();
      if (t._timer) { clearTimeout(t._timer); t._timer = null; }
      t.className = 'toast';
      t.style.pointerEvents = 'none';
      if (onUndo) onUndo();
    };
  }
}

/* ===== Modal ===== */
function showModal(opts) {
  var m = document.getElementById('modal');
  var cancelHtml = (opts.cancelText !== null && opts.cancelText !== undefined) ?
    '<button class="btn btn-secondary" onclick="hideModal()">' + (opts.cancelText || '取消') + '</button>' : '';
  var confirmClass = opts.danger ? 'btn-danger' : 'btn-primary';
  var html = '<div class="modal-title">' + (opts.title || '') + '</div>' +
    '<div class="modal-body">' + (opts.body || '') + '</div>' +

function getModalInputValues() {

/* ===== Picker (Time & Date) ===== */
var _pickerCallback = null;
function hidePicker() {
  document.getElementById('pickerOverlay').className = 'picker-overlay';
  _pickerCallback = null;
}

function showTimePicker(opts) {
  var current = opts.current || '12:00';
  var parts = current.split(':');
  var selH = parseInt(parts[0] || 12, 10);
  var selM = parseInt(parts[1] || 0, 10);
  selH = isNaN(selH) ? 12 : selH;
  selM = isNaN(selM) ? 0 : selM;
  _pickerCallback = opts.onConfirm || null;

  var ITEM_H = 44;
  var hours = [];
  for (var h = 0; h < 24; h++) hours.push(pad2(h));
  var mins = [];
  for (var m = 0; m < 60; m++) mins.push(pad2(m));

  function buildItems(arr) {
    var html = '<div class="wheel-spacer"></div>';
    for (var i = 0; i < arr.length; i++) {
      html += '<div class="wheel-item" data-idx="' + i + '">' + arr[i] + '</div>';
    }
    html += '<div class="wheel-spacer"></div>';
    return html;
  }

  function updateActive(col, idx) {
    var items = col.getElementsByTagName('div');
    for (var i = 0; i < items.length; i++) {
      if (items[i].className.indexOf('wheel-item') === -1) continue;
      var itemIdx = parseInt(items[i].getAttribute('data-idx'), 10);
      if (itemIdx === idx) {
        items[i].className = 'wheel-item active';
      } else {
        items[i].className = 'wheel-item';
      }
    }
  }

  function render() {
    var html = '<div class="picker-header">' +
      '<div class="picker-title">选择时间</div>' +
      '<div class="picker-display" id="timeDisplay">' + pad2(selH) + ':' + pad2(selM) + '</div></div>' +
      '<div class="picker-body" style="padding:24px 16px">' +
      '<div class="wheel-wrap">' +
      '<div class="wheel-highlight"></div>' +
      '<div class="wheel-col" id="wheelHour">' + buildItems(hours) + '</div>' +
      '<div class="wheel-sep">:</div>' +
      '<div class="wheel-col" id="wheelMin">' + buildItems(mins) + '</div>' +
      '</div>' +
      '<div class="wheel-labels"><div class="wheel-label">小时</div><div class="wheel-label">分钟</div></div>' +
      '</div>' +
      '<div class="picker-actions">' +
      '<button class="btn btn-secondary" onclick="hidePicker()">取消</button>' +
      '<button class="btn btn-primary" onclick="_confirmTimePicker()">确认</button></div>';
    document.getElementById('pickerSheet').innerHTML = html;

    var hourCol = document.getElementById('wheelHour');
    var minCol = document.getElementById('wheelMin');
    var display = document.getElementById('timeDisplay');

    // Set initial scroll positions
    hourCol.scrollTop = selH * ITEM_H;
    minCol.scrollTop = selM * ITEM_H;
    updateActive(hourCol, selH);
    updateActive(minCol, selM);

    // Scroll listeners with debounce
    var hTimer = null, mTimer = null;
    hourCol.onscroll = function() {
      if (hTimer) clearTimeout(hTimer);
      hTimer = setTimeout(function() {
        var idx = Math.round(hourCol.scrollTop / ITEM_H);
        if (idx < 0) idx = 0;
        if (idx > 23) idx = 23;
        selH = idx;
        updateActive(hourCol, idx);
        display.textContent = pad2(selH) + ':' + pad2(selM);
      }, 100);
    };
    minCol.onscroll = function() {
      if (mTimer) clearTimeout(mTimer);
      mTimer = setTimeout(function() {
        var idx = Math.round(minCol.scrollTop / ITEM_H);
        if (idx < 0) idx = 0;
        if (idx > 59) idx = 59;
        selM = idx;
        updateActive(minCol, idx);
        display.textContent = pad2(selH) + ':' + pad2(selM);
      }, 100);
    };

    // Click-to-select on items
    var hItems = hourCol.getElementsByTagName('div');
    for (var i = 0; i < hItems.length; i++) {
      if (hItems[i].className.indexOf('wheel-item') === -1) continue;
      hItems[i].onclick = function() {

      };

  window._confirmTimePicker = function() {

function showDatePicker(opts) {
  var current = opts.current || todayStr();
  var cD = new Date(current + 'T00:00:00');
  if (isNaN(cD.getTime())) cD = new Date();
  var selYear = cD.getFullYear();
  var selMonth = cD.getMonth();
  var selDay = cD.getDate();
  var viewYear = selYear;
  var viewMonth = selMonth;
  _pickerCallback = opts.onConfirm || null;

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function firstWeekday(y, m) { return new Date(y, m, 1).getDay(); }

  function render() {
    var total = daysInMonth(viewYear, viewMonth);
    var firstWd = firstWeekday(viewYear, viewMonth);
    var prevTotal = daysInMonth(viewYear, viewMonth - 1);
    var daysHtml = '';
    var wdNames = ['日','一','二','三','四','五','六'];
    var wdHtml = '';
    for (var i = 0; i < 7; i++) {
      wdHtml += '<div class="picker-weekday">' + wdNames[i] + '</div>';
    }
    // previous month padding
    for (var p = firstWd - 1; p >= 0; p--) {
      daysHtml += '<div class="picker-day other-month">' + (prevTotal - p) + '</div>';
    }
    // current month
    var today = new Date();
    for (var d = 1; d <= total; d++) {
      var isToday = (viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate());
      var isSel = (viewYear === selYear && viewMonth === selMonth && d === selDay);
      var cls = 'picker-day';
      if (isSel) cls += ' selected';
      else if (isToday) cls += ' today';
      daysHtml += '<div class="' + cls + '" data-d="' + d + '" onclick="_pickDateDay(this)">' + d + '</div>';
    }
    // next month padding to fill grid
    var cells = firstWd + total;
    var rows = Math.ceil(cells / 7);
    var nextPad = rows * 7 - cells;
    for (var n = 1; n <= nextPad; n++) {
      daysHtml += '<div class="picker-day other-month">' + n + '</div>';
    }

    var html = '<div class="picker-header">' +
      '<div class="picker-title">选择日期</div>' +
      '<div class="picker-display">' + selYear + '-' + pad2(selMonth + 1) + '-' + pad2(selDay) + '</div></div>' +
      '<div class="picker-body">' +
      '<div class="picker-nav">' +
      '<div class="picker-nav-btn" onclick="_pickDatePrevMonth()">&#8249;</div>' +
      '<div class="picker-nav-label">' + viewYear + '年 ' + pad2(viewMonth + 1) + '月</div>' +
      '<div class="picker-nav-btn" onclick="_pickDateNextMonth()">&#8250;</div></div>' +
      '<div class="picker-weekdays">' + wdHtml + '</div>' +
      '<div class="picker-days">' + daysHtml + '</div></div>' +
      '<div class="picker-actions">' +
      '<button class="btn btn-secondary" onclick="hidePicker()">取消</button>' +
      '<button class="btn btn-primary" onclick="_confirmDatePicker()">确认</button></div>';
    document.getElementById('pickerSheet').innerHTML = html;
  }

  window._pickDateDay = function(el) {
    selDay = parseInt(el.getAttribute('data-d'), 10);
    selYear = viewYear;
    selMonth = viewMonth;
    render();
  };
  window._pickDatePrevMonth = function() {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  };
  window._pickDateNextMonth = function() {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  };
  window._confirmDatePicker = function() {
    var cb = _pickerCallback;
    var val = selYear + '-' + pad2(selMonth + 1) + '-' + pad2(selDay);
    hidePicker();
    if (cb) cb(val);
  };

  render();
  document.getElementById('pickerOverlay').className = 'picker-overlay show';
}

function getCompletedCycles() {

// 自动识别「真实经期」用于预测：
//  - 一次出血持续 ≥ MIN_PERIOD_DAYS 天视为月经；更短的（点滴 / 排卵期出血）不计入周期计算。
//  - 两条经期开始日间隔 < MERGE_GAP 天则合并为同一次（如用户分段记录、排卵期出血夹在中间）。
// 这样用户只需记录「出血开始 / 结束」，无需自己判断类型，预测也不会被短间隔出血带偏。
// 运行时自动判定：某条出血是「月经(period)」还是「异常出血(spotting)」。
// 不存 type 字段——用户只记开始/结束，判断交给 app，用户无需区分。
// 依据：既往月经的周期规律。月经后不久（远不到预期下次窗口）就来的出血 → 异常出血，不污染预测。
function classifyCycles() {
  var MIN_PERIOD_DAYS = 3;
  var all = state.data.cycles.slice().sort(function(a, b) {
    return a.startDate < b.startDate ? -1 : (a.startDate > b.startDate ? 1 : 0);
  });
  var result = {};
  // 候选：进行中 或 时长达到月经下限的出血
  var candidates = all.filter(function(c) {
    var dur = c.endDate ? (daysBetween(c.startDate, c.endDate) + 1) : 0;
    return !c.endDate || dur >= MIN_PERIOD_DAYS;
  });
  // 数据太少：全部当月经，保证预测始终可用
  if (candidates.length < 2) {
    all.forEach(function(c) { result[c.id] = 'period'; });
    return result;
  }
  // 初始平均周期：用「较大的半数间隔」估计，排除异常出血的短间隔干扰
  // （异常出血通常紧挨着上次月经、间隔远小于真月经间隔，会被排除在半数之外）
  var cl = [];
  for (var i = 1; i < candidates.length; i++) {
    cl.push(daysBetween(candidates[i - 1].startDate, candidates[i].startDate));
  }
  cl.sort(function(a, b) { return a - b; });
  var k = Math.max(1, Math.ceil(cl.length / 2));
  var avgSum = 0;
  for (var ci = cl.length - k; ci < cl.length; ci++) avgSum += cl[ci];
  var avgCycle = Math.round(avgSum / k) || 28;
  var TOL = Math.max(7, Math.round(avgCycle * 0.4)); // 预期月经窗口的容差
  var lastPeriodStart = null;
  for (var j = 0; j < candidates.length; j++) {
    var c = candidates[j];
    if (lastPeriodStart === null) {
      result[c.id] = 'period';
      lastPeriodStart = c.startDate;
    } else {
      var gap = daysBetween(lastPeriodStart, c.startDate);
      if (gap >= avgCycle - TOL) {
        // 落在预期月经窗口附近（或之后）：视为月经，并刷新锚点
        result[c.id] = 'period';
        lastPeriodStart = c.startDate;
      } else {
        // 距上次月经太近（远没到预期经期）：异常出血（排卵期/不规则出血）
        result[c.id] = 'spotting';
      }
    }
  }
  // 过短的出血（点滴）直接判为异常出血
  all.forEach(function(c) { if (!(c.id in result)) result[c.id] = 'spotting'; });
  return result;
}

function getRealPeriods() {
  var classification = classifyCycles();
  var periods = state.data.cycles.filter(function(c) { return classification[c.id] === 'period'; });
  periods.sort(function(a, b) {
    return a.startDate < b.startDate ? -1 : (a.startDate > b.startDate ? 1 : 0);
  });
  // 仅合并真正连续的分段记录（同一阵月经用户分两次记）：间隔 ≤3 天才合并；
  // 不再用大间隔合并，避免把月经后的异常出血吞进经期长度、污染预测。
  var MERGE_GAP = 3;
  var merged = [];
  for (var j = 0; j < periods.length; j++) {
    var c = periods[j];
    var p = { start: c.startDate, end: c.endDate, dur: c.endDate ? (daysBetween(c.startDate, c.endDate) + 1) : 1 };
    if (merged.length && daysBetween(merged[merged.length - 1].start, p.start) <= MERGE_GAP) {
      var prev = merged[merged.length - 1];
      if (p.end && (!prev.end || p.end > prev.end)) prev.end = p.end;
      prev.dur = prev.end ? (daysBetween(prev.start, prev.end) + 1) : prev.dur;
    } else {
      merged.push(p);
    }
  }
  return merged;
}

function predictNextPeriod() {
  var realPeriods = getRealPeriods();
  if (realPeriods.length === 0) return null;

  // 平均周期长度（相邻真实经期开始日间隔）
  var cycleLengths = [];
  for (var i = 1; i < realPeriods.length; i++) {
    cycleLengths.push(daysBetween(realPeriods[i - 1].start, realPeriods[i].start));
  }
  if (cycleLengths.length === 0) cycleLengths.push(28);
  var avgCycle = Math.round(cycleLengths.reduce(function(a, b) { return a + b; }, 0) / cycleLengths.length);

  // 平均经期长度
  var periodLengths = [];
  for (var k = 0; k < realPeriods.length; k++) {
    if (realPeriods[k].end) periodLengths.push(realPeriods[k].dur);
  }
  var avgPeriod = periodLengths.length ? Math.round(periodLengths.reduce(function(a, b) { return a + b; }, 0) / periodLengths.length) : 3;
  if (avgPeriod < 2) avgPeriod = 3;

  // 锚点：进行中的经期优先，否则最近一次真实经期
  var current = getCurrentCycle();
  var lastStart = current ? current.startDate : realPeriods[realPeriods.length - 1].start;
  var nextStart = addDays(lastStart, avgCycle);
  var nextEnd = addDays(nextStart, avgPeriod - 1);

  return {
    startDate: nextStart,
    endDate: nextEnd,
    cycleLength: avgCycle,
    periodLength: avgPeriod
  };
}

function getAllPeriodDates() {
  var classification = classifyCycles();
  var dates = {};
  for (var i = 0; i < state.data.cycles.length; i++) {
    var c = state.data.cycles[i];

    var d = new Date(c.startDate + 'T00:00:00');
    var endD = new Date((c.endDate || todayStr()) + 'T00:00:00');

}

/* ===== Cycle Phase (月经期 / 卵泡期 / 排卵期 / 黄体期) ===== */
var PHASES = {
  menstrual: {key:'menstrual', label:'月经期', short:'经期', desc:'子宫内膜脱落出血', color:'#E8657A', bg:'#FCEEF1', text:'#C94B63'},
  follicular:{key:'follicular', label:'卵泡期', short:'卵泡', desc:'卵泡发育成熟', color:'#5B8FD9', bg:'#EAF1FB', text:'#3A6BB0'},
  ovulation: {key:'ovulation', label:'排卵期', short:'排卵', desc:'易受孕', color:'#2E9E6B', bg:'#E7F5EE', text:'#1F7A4D'},
  luteal:    {key:'luteal', label:'黄体期', short:'黄体', desc:'黄体形成', color:'#D9962E', bg:'#FBF1E0', text:'#B9792B'}
};

// 0-based day difference between two 'YYYY-MM-DD' dates (today vs date => negative if date is before today)
function dateDiffDays(a, b) {
  var s = new Date(a + 'T00:00:00').getTime();
  var e = new Date(b + 'T00:00:00').getTime();
  return Math.round((e - s) / 86400000);
}

// Returns a phase object (from PHASES) for a given date, based on the predicted cycle.
// Anchored on the predicted next period start, repeating every avgCycle days.
// NOTE: this is an estimate for visualization, real cycles vary.
function getPhaseForDate(dateStr, prediction) {
  if (!prediction) return null;
  var L = prediction.cycleLength;
  var P = prediction.periodLength;
  if (L < 14) L = 28;
  if (P < 1) P = 1;
  if (P > L - 2) P = L - 2; // safety clamp
  var base = prediction.startDate;             // predicted next period start
  var diff = dateDiffDays(base, dateStr);      // 0 if same day as next period start
  var cycleDay = ((diff % L) + L) % L;         // 0..L-1 (day-of-cycle)
  var ovDay = L - 14;                          // ovulation ~14 days before next period
  var fertileStart = ovDay - 5;                // fertile window (sperm can survive ~5 days)
  var fertileEnd = ovDay + 1;                  // egg viable ~1 day
  if (fertileStart < P) fertileStart = P;
  if (fertileEnd < fertileStart) fertileEnd = fertileStart;
  if (cycleDay >= 0 && cycleDay <= P - 1) return PHASES.menstrual;
  if (cycleDay >= fertileStart && cycleDay <= fertileEnd) return PHASES.ovulation;
  if (cycleDay >= P && cycleDay < fertileStart) return PHASES.follicular;
  if (cycleDay > fertileEnd && cycleDay < L) return PHASES.luteal;
  return null;
}

// Today's phase label for home/calendar banner
function getTodayPhaseLabel(prediction) {
  var cur = getCurrentCycle();
  if (cur) return PHASES.menstrual.label;
  if (!prediction) return '';
  var ph = getPhaseForDate(todayStr(), prediction);
  return ph ? ph.label : '';
}

// Days until next predicted period (0 = today)
function getDaysToNextPeriod(prediction) {
  if (!prediction) return null;
  return dateDiffDays(todayStr(), prediction.startDate);
}

// Build a "next period countdown" card for the home page.
// Works even when no cycle is currently ongoing (period has ended).
function buildCountdownCard(prediction) {
  if (!prediction) return '';
  var d = getDaysToNextPeriod(prediction);
  var phaseLabel = getTodayPhaseLabel(prediction);
  var countdownText, countdownSub;

  } else {

    countdownSub = '下次经期';
  }
  var phaseHtml = phaseLabel
    ? '<div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary)">现在处于 <span style="font-weight:600;color:var(--primary-dark)">' + phaseLabel + '</span></div>'
    : '';
  return '<div class="predict-card" style="cursor:pointer" onclick="nav(\'calendar\')">' +
    '<div class="predict-title">🔮 下次经期倒计时</div>' +
    '<div style="text-align:center">' +
    '<div style="font-size:30px;font-weight:700;color:var(--primary);line-height:1.1">' + countdownText + '</div>' +
    '<div style="font-size:13px;color:var(--text-secondary);margin-top:6px">' + countdownSub + '</div>' +
    '</div>' + phaseHtml +
    '<div class="predict-stats" style="margin-top:14px">' +
    '<div class="predict-stat"><div class="predict-num" style="font-size:20px">' + prediction.cycleLength + '</div><div class="predict-label">天周期</div></div>' +
    '<div class="predict-divider"></div>' +
    '<div class="predict-stat"><div class="predict-num" style="font-size:20px">' + prediction.periodLength + '</div><div class="predict-label">天经期</div></div>' +
    '</div></div>';
}

      '<div class="predict-divider"></div>' +

    html += '<div class="predict-card">' +
      '<div class="predict-title">🔮 经期预测</div>' +
      '<div style="text-align:center;color:var(--text-secondary);padding:16px;font-size:14px">暂无足够历史数据用于预测<br>请先完成至少1个完整周期</div>' +
      '</div>';
  }

  // 今日所处阶段 banner（按阶段给白话提示）
  var todaysPhaseObj = null;
  if (getCurrentCycle()) todaysPhaseObj = PHASES.menstrual;
  else if (prediction) todaysPhaseObj = getPhaseForDate(todayStr(), prediction);
  var dtn = getDaysToNextPeriod(prediction);
  if (todaysPhaseObj) {
    var bannerSub = '';
    if (todaysPhaseObj.key === 'ovulation') bannerSub = ' · 易受孕窗口';
    else if (todaysPhaseObj.key === 'follicular') bannerSub = ' · 经期刚结束';
    else if (todaysPhaseObj.key === 'menstrual') bannerSub = ' · 正在经期';
    else if (todaysPhaseObj.key === 'luteal') {
      if (dtn !== null && dtn > 0) bannerSub = ' · 距下次经期还有 ' + dtn + ' 天';
      else if (dtn === 0) bannerSub = ' · 今天预计来潮';
    }
    html += '<div class="phase-banner">今天：<strong>' + todaysPhaseObj.label + '</strong>' + bannerSub + '</div>';
  }

  // Month navigation
  html += '<div class="flex-between" style="margin-bottom:10px;padding:0 4px">' +
    '<button class="btn btn-sm" onclick="changeCalendarMonth(-1)" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px">◀</button>' +
    '<div style="font-size:18px;font-weight:700;color:var(--text)">' + year + '年 ' + monthNames[month] + '</div>' +
    '<button class="btn btn-sm" onclick="changeCalendarMonth(1)" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px">▶</button>' +
    '</div>';

  // Calendar grid
  html += '<div class="calendar-grid">';
  for (var i = 0; i < 7; i++) {
    html += '<div class="calendar-header-cell">' + dayHeaders[i] + '</div>';
  }
  for (var i = 0; i < firstDay; i++) {
    html += '<div class="calendar-cell"></div>';
  }
  for (var day = 1; day <= daysInMonth; day++) {
    var date = year + '-' + pad2(month + 1) + '-' + pad2(day);
    var isPeriod = !!periodDates[date];
    var isPredicted = !!predictedDates[date];
    var isSpotting = !!spottingDates[date];
    var isTD = date === today;
    var cycleId = '';
    if (isPeriod || isSpotting) cycleId = findCycleIdForDate(date);
    var hasLog = hasDaySymptoms(date);

    // Estimate phase for days that are not actual/predicted period or spotting days
    var phase = null;
    if (!isPeriod && !isPredicted && !isSpotting) phase = getPhaseForDate(date, prediction);

    var cls = 'calendar-cell';
    if (isPeriod) cls += ' period-day';
    if (isPredicted && !isPeriod) cls += ' predicted-day';
    if (isSpotting && !isPeriod && !isPredicted) cls += ' spotting-day';
    if (phase) cls += ' ' + phase.key + '-day';
    if (isTD) cls += ' today';
    cls += ' has-records'; // 任意日期都可点击进入记录

    var onClick = '';
    if (cycleId) {
      onClick = ' onclick="nav(\'dayDetail\',{cycleId:\'' + cycleId + '\',date:\'' + date + '\'})"';
    } else {
      onClick = ' onclick="nav(\'symptoms\',{date:\'' + date + '\'})"';
    }

    // marker: period/predicted -> dot ; spotting -> 出血小标 ; phase -> 阶段小标
    var marker = '';
    if (isPeriod || isPredicted) {
      marker = '<span class="calendar-dot"></span>';
    } else if (isSpotting) {
      marker = '<span class="calendar-spot-tag">出血</span>';
    } else if (phase) {
      var PHASE_TAG = { menstrual:'经期', follicular:'卵泡', ovulation:'易孕', luteal:'经前' };
      var tagText = PHASE_TAG[phase.key] || '';
      marker = '<span class="calendar-phase-tag" style="color:' + phase.color + '">' + tagText + '</span>';
    }

    html += '<div class="' + cls + '"' + onClick + '>' +
      (hasLog ? '<span class="calendar-log-dot"></span>' : '') +
      '<span class="calendar-day-num">' + day + '</span>' +
      marker +
      '</div>';
  }
  html += '</div>';

  // Legend（全名 + 白话说明，让用户无需猜）
  html += '<div class="calendar-legend">' +
    '<span><span class="calendar-legend-dot" style="background:#FCEEF1;border:1px solid #E8657A"></span> 月经期（来姨妈）</span>' +
    '<span><span class="calendar-legend-dot spotting"></span> 异常出血（非经期）</span>' +
    '<span><span class="calendar-legend-dot" style="background:#EAF1FB;border:1px solid #5B8FD9"></span> 卵泡期（经期后）</span>' +
    '<span><span class="calendar-legend-dot" style="background:#E7F5EE;border:1px solid #2E9E6B"></span> 排卵期（易受孕）</span>' +
    '<span><span class="calendar-legend-dot" style="background:#FBF1E0;border:1px solid #D9962E"></span> 黄体期（经前）</span>' +
    '<span><span class="calendar-legend-dot log"></span> 有症状/白带记录</span>' +
    '<span><span class="calendar-today-mark"></span> 今天</span>' +
    '</div>' +
    '<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-tertiary)">格子里的「经期/卵泡/易孕/经前」即当前所处阶段 · 月经期为记录或预测，其余为按周期估算 · <span style="color:#8A8F99">浅灰「出血」为异常出血，不计入预测</span></div>' +
    '<div style="text-align:center;margin-top:6px;font-size:12px;color:var(--text-tertiary)">点击任意日期：有出血看当日详情，没出血也能记白带、胸涨等</div>';

  el.innerHTML = html;
}

/* ===== Navigation ===== */
function nav(page, params) {
  params = params || {};
  state.navHistory.push({page: state.currentPage, params: state.pageParams});
  navigateTo(page, params);
}

function navigateTo(page, params) {
  params = params || {};
  state.currentPage = page;
  state.pageParams = params;

  var pages = document.getElementsByClassName('page');
  for (var i = 0; i < pages.length; i++) pages[i].className = 'page';

  var target = document.getElementById('page-' + page);
  if (target) target.className = 'page active';

  var title = document.getElementById('headerTitle');
  if (title) title.textContent = PAGE_TITLES[page] || '';

  var isSub = arrayContains(SUB_PAGES, page);

  // 「症状打卡」页：若是从子页面（经期日历 / 当日详情 / 本周期每日）点进来的，
  // 也按子页面处理 —— 左上角显示返回按钮、隐藏底部导航，方便返回上一层。
  if (page === 'symptoms') {
    var from = state.navHistory.length > 0 ? state.navHistory[state.navHistory.length - 1].page : null;
    if (from && arrayContains(SUB_PAGES, from)) state.symptomsAsSub = true;
    else if (from !== 'symptoms') state.symptomsAsSub = false;
    if (state.symptomsAsSub) isSub = true;
  } else {
    state.symptomsAsSub = false;
  }

  var back = document.getElementById('headerBack');
  if (back) back.style.display = isSub ? 'flex' : 'none';

  if (isSub) document.body.className = 'no-nav';
  else document.body.className = '';

  var navItems = document.getElementsByClassName('nav-item');
  for (var j = 0; j < navItems.length; j++) {
    if (navItems[j].getAttribute('data-page') === page) navItems[j].className = 'nav-item active';
    else navItems[j].className = 'nav-item';
  }

  try {
    renderPage(page, params);
  } catch (e) {
    showError('渲染错误: ' + e.message);
  }
  try { window.scrollTo(0, 0); } catch(x) {}
}

function goBack() {
  if (state.navHistory.length > 0) {
    var prev = state.navHistory.pop();
    navigateTo(prev.page, prev.params);
  } else {
    navigateTo('home');
  }
}

function renderPage(page, params) {
  if (page === 'home') renderHome();
  else if (page === 'record') renderRecord();
  else if (page === 'symptoms') renderSymptoms(params);
  else if (page === 'cycleDaily') renderCycleDaily(params);
  else if (page === 'dayDetail') renderDayDetail(params);
  else if (page === 'calendar') renderCalendar();
  else if (page === 'history') renderHistory();
  else if (page === 'backup') renderBackup();
}

/* ===== Home Page ===== */
function renderHome() {
  var cycle = getCurrentCycle();
  var prediction = predictNextPeriod();
  var el = document.getElementById('page-home');

  if (!cycle) {
    var lastEnded = getLastEndedPeriodCycle();
    var endedDays = 0;
    var recentlyEnded = false;
    if (lastEnded) {
      endedDays = daysBetween(lastEnded.endDate, todayStr());
      recentlyEnded = endedDays >= 0 && endedDays <= 3;
    }

    if (recentlyEnded) {
      // Recently ended cycle - offer to continue
      var stats = getCycleStats(lastEnded.id);
      el.innerHTML = buildCountdownCard(prediction) +
        '<div class="predict-card" style="margin-bottom:12px;cursor:pointer" onclick="nav(\'cycleDaily\',{cycleId:\'' + lastEnded.id + '\'})">' +
        '<div class="predict-title">🔔 上次经期刚结束</div>' +
        '<div style="text-align:center;margin:8px 0">' +
        '<div style="font-size:20px;font-weight:700;color:var(--primary-dark)">' + formatDate(lastEnded.startDate) + ' ~ ' + formatDate(lastEnded.endDate) + '</div>' +
        '<div style="font-size:14px;color:var(--text-secondary);margin-top:4px">持续 ' + daysBetween(lastEnded.startDate, lastEnded.endDate) + ' 天 · ' + endedDays + ' 天前结束</div>' +
        '<div style="font-size:12px;color:var(--text-tertiary);margin-top:8px">查看这次的每日记录 ›</div>' +
        '</div></div>' +
        '<div class="empty-state" style="padding:12px 20px">' +
        '<div class="empty-icon" style="font-size:42px">🥺</div>' +
        '<div class="empty-title" style="font-size:16px">是误触结束了吗？</div>' +
        '<div class="empty-desc">按错了不用担心，可以重新打开上个周期，继续记录更换和症状。</div>' +
        '<button class="btn btn-primary" style="max-width:260px;margin:8px auto" onclick="reopenLastEnded()">重新打开上个周期</button>' +
        '<div style="margin-top:12px;font-size:13px;color:var(--text-tertiary)">—— 或者 ——</div>' +
        '<button class="btn btn-secondary" style="max-width:260px;margin:8px auto" onclick="showStartCycleModal()">记录出血</button>' +
        '</div>';
    } else {
      el.innerHTML = buildCountdownCard(prediction) +
        '<div class="empty-state">' +
        '<div class="empty-icon">🌸</div>' +
        '<div class="empty-title">开始记录出血</div>' +
        '<div class="empty-desc">点击下方按钮，记录本次来潮日期<br>数据仅保存在本机，他人无法查看</div>' +
        '<button class="btn btn-primary" style="max-width:260px;margin:0 auto" onclick="showStartCycleModal()">记录出血</button>' +
        '</div>';
    }
    return;
  }

  var stats = getCycleStats(cycle.id);
  var dayCount = daysBetween(cycle.startDate, todayStr());

  // recent: last 5 changes
  var recentCount = Math.min(5, cycle.changes.length);
  var recent = [];
  for (var i = cycle.changes.length - 1; i >= 0 && recent.length < recentCount; i--) {
    recent.push(cycle.changes[i]);
  }

  // bleeding bars - compute max
  var maxBl = 1;
  for (var k = 0; k < BLEEDING.length; k++) {
    if (stats.bleeding[BLEEDING[k].id] > maxBl) maxBl = stats.bleeding[BLEEDING[k].id];
  }

  var bleedingHtml = '';
  for (var bi = 0; bi < BLEEDING.length; bi++) {
    var b = BLEEDING[bi];
    var cnt = stats.bleeding[b.id];
    var w = cnt > 0 ? Math.max((cnt / maxBl) * 100, 8) : 0;
    bleedingHtml += '<div class="bleeding-row"><div class="bleeding-name">' + b.label + '</div>' +
      '<div class="bleeding-track"><div class="bleeding-fill" style="width:' + w + '%;background:' + b.color + '"></div></div>' +
      '<div class="bleeding-count">' + cnt + '</div></div>';
  }

  var recentHtml = '';
  if (recent.length > 0) {
    recentHtml = '<div class="section-title">🕐 最近记录</div>';
    for (var ri = 0; ri < recent.length; ri++) {
      var ch = recent[ri];
      var p = getProductById(ch.productId);
      var bb = getBleedingById(ch.bleeding);
      var pname = p ? p.short : '?';
      var bname = bb ? bb.label : '?';
      var bcolor = bb ? bb.color : '#999';
      recentHtml += '<div class="recent-item"><div class="recent-time">' + (ch.time || '') + '</div>' +
        '<div class="recent-product">' + pname + '</div>' +
        '<div class="recent-bleeding" style="background:' + bcolor + '20;color:' + bcolor + '">' + bname + '</div></div>';
    }
  }

  el.innerHTML = '' +
    '<div class="card"><div class="cycle-info">' +
    '<div class="cycle-day-num">第 ' + dayCount + ' 天</div>' +
    '<div class="cycle-day-count">' + formatDate(cycle.startDate) + ' 来潮 · 进行中</div>' +
    '</div>' +
    '<div class="stats-row">' +
    '<div class="stat-card"><div class="stat-num">' + stats.napkin + '</div><div class="stat-label">卫生巾</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + stats.pad + '</div><div class="stat-label">护垫</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + stats.tampon + '</div><div class="stat-label">棉条</div></div>' +
    '<div class="stat-card"><div class="stat-num">' + stats.pants + '</div><div class="stat-label">安睡裤</div></div>' +
    '</div></div>' +
    '<div class="card"><div class="card-title">📊 出血量分布</div>' + bleedingHtml + '</div>';

  // 下次经期倒计时（即使经期已结束也会显示）
  el.innerHTML += buildCountdownCard(prediction);

  el.innerHTML +=
    '<div class="btn-row">' +
    '<button class="btn btn-secondary" onclick="nav(\'record\')">✏️ 记录更换</button>' +
    '<button class="btn btn-secondary" onclick="nav(\'calendar\')">📅 经期日历</button>' +
    '</div>' +
    '<div class="btn-row" style="margin-top:8px">' +
    '<button class="btn btn-secondary" onclick="nav(\'cycleDaily\',{cycleId:\'' + cycle.id + '\'})">📋 本期每日</button>' +
    '<button class="btn btn-primary" onclick="showEndCycleModal(\'' + cycle.id + '\')">✓ 结束本期</button>' +
    '</div>' +
    recentHtml;
}

/* ===== Record Page ===== */
function renderRecord() {
  var el = document.getElementById('page-record');
  var cycle = getCurrentCycle();
  var editing = (state.editingCycleId && state.editingChangeId) ? true : false;
  var editChange = null;
  if (editing) {
    editChange = getChangeById(state.editingCycleId, state.editingChangeId);
    cycle = getCycleById(state.editingCycleId) || cycle;
  }
  var date = state.recordDate || (editChange ? editChange.date : todayStr());
  var time = (editChange && editChange.time) ? editChange.time : nowTimeStr();
  var note = (editChange && editChange.note) ? editChange.note : '';

  // Set pre-selected product/bleeding from edit data or defaults
  if (editChange) {
    state.selectedProduct = editChange.productId;
    state.selectedBleeding = editChange.bleeding;
  } else {
    // 刚添加完自定义用品时，默认选中它（仅生效一次）
    var prefer = state.justAddedProduct;
    state.justAddedProduct = null;
    if (prefer && getProductById(prefer)) state.selectedProduct = prefer;
    else state.selectedProduct = PRODUCTS[0].id;
    state.selectedBleeding = BLEEDING[1].id;
  }

  if (!cycle) {
    var lastEnded2 = getLastEndedCycle();
    var recentlyEnded2 = false;
    if (lastEnded2) {
      var ed = daysBetween(lastEnded2.endDate, todayStr());
      recentlyEnded2 = ed <= 3;
    }
    var reopenBtn = recentlyEnded2 ? '<button class="btn btn-secondary" style="max-width:200px;margin:8px auto 0" onclick="reopenLastEnded()">重新打开上个周期</button>' : '';
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div>' +
      '<div class="empty-title">还没有出血记录</div>' +
      '<div class="empty-desc">月经或异常出血，都从这里开始记录</div>' +
      '<button class="btn btn-primary" style="max-width:200px;margin:16px auto 0" onclick="showStartCycleModal()">记录出血</button>' +
      reopenBtn + '</div>';
    return;
  }

  var allProds = getAllProducts();
  var hasCustomProd = (visibleCustomProductCount() > 0);
  var chipsHtml = '';
  for (var i = 0; i < allProds.length; i++) {
    var p = allProds[i];
    var isSel = (state.selectedProduct === p.id) ? ' selected' : '';
    // 编辑态下，自建用品右上角出现删除角标
    var delX = (p.custom && state.editingProducts) ?
      '<span class="chip-x" onclick="event.stopPropagation();confirmDeleteCustomProduct(\'' + p.id + '\')">✕</span>' : '';
    chipsHtml += '<div class="chip' + isSel + '" data-product="' + p.id + '" onclick="selectProduct(this,\'' + p.id + '\')">' + delX + p.label + '</div>';
  }
  chipsHtml += '<div class="chip chip-add" onclick="showAddProductModal()">＋ 自定义</div>';

  var bleedingHtml = '';
  for (var j = 0; j < BLEEDING.length; j++) {
    var b = BLEEDING[j];
    var isSel2 = (state.selectedBleeding === b.id);
    var selCls = isSel2 ? ' selected' : '';
    var selStyle = isSel2 ? ' style="background:' + b.color + ';border-color:' + b.color + ';color:#fff"' : '';
    bleedingHtml += '<div class="bleeding-btn' + selCls + '" data-bleeding="' + b.id + '" onclick="selectBleeding(this,\'' + b.id + '\')"' + selStyle + '>' + b.label + '</div>';
  }

  var titleHtml = editing
    ? '<div style="background:var(--primary-light);color:var(--primary-dark);padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;text-align:center;font-weight:500">✎ 正在编辑记录 — 修改后点击保存</div>'
    : '';
  var btnLabel = editing ? '更新记录' : '保存记录';
  var btnOnclick = editing ? 'saveChange(true)' : 'saveChange()';

  el.innerHTML = titleHtml + '<div class="card"><div class="card-title">📅 更换时间</div>' +
    '<div class="form-row"><div class="form-group"><div class="form-label">日期</div>' +
    '<input type="text" class="form-input picker-input" id="recDate" value="' + date + '" readonly onclick="showDatePicker({current:this.value,onConfirm:function(v){document.getElementById(\'recDate\').value=v}})"></div>' +
    '<div class="form-group"><div class="form-label">时间</div>' +
    '<input type="text" class="form-input picker-input" id="recTime" value="' + time + '" readonly onclick="showTimePicker({current:this.value,onConfirm:function(v){document.getElementById(\'recTime\').value=v}})"></div></div></div>' +
    '<div class="card"><div class="card-title">🩸 选择用品' +
    (hasCustomProd ? '<span class="sym-edit-btn" style="margin-left:auto" onclick="toggleEditProducts()">' + (state.editingProducts ? '完成' : '编辑') + '</span>' : '') +
    '</div>' +
    '<div class="chip-grid" id="productGrid">' + chipsHtml + '</div></div>' +
    '<div class="card"><div class="card-title">💧 出血量</div>' +
    '<div class="bleeding-grid" id="bleedingGrid">' + bleedingHtml + '</div></div>' +
    '<div class="card"><div class="card-title">📝 备注（可选）</div>' +
    '<textarea class="form-input" id="recNote" placeholder="记录这次更换的其他情况...">' + note + '</textarea></div>' +
    '<button class="btn btn-primary" onclick="' + btnOnclick + '">' + btnLabel + '</button>' +
    (editing ? '<button class="btn btn-secondary" style="margin-top:8px;border:1px solid var(--border)" onclick="cancelEdit()">取消编辑</button>' : '');
}

function selectProduct(el, id) {
  var chips = document.getElementById('productGrid').getElementsByClassName('chip');
  for (var i = 0; i < chips.length; i++) {
    // 只重置用品 chip（带 data-product）；「＋ 自定义」那个保持虚线样式
    if (chips[i].getAttribute('data-product')) chips[i].className = 'chip';
  }
  el.className = 'chip selected';
  state.selectedProduct = id;
}

/* ===== 自定义用品：增 / 删 / 编辑态 ===== */
function visibleCustomProductCount() {
  var cp = state.data.customProducts || [];
  var n = 0;
  for (var i = 0; i < cp.length; i++) { if (!cp[i].retired) n++; }
  return n;
}

function toggleEditProducts() {
  state.editingProducts = !state.editingProducts;
  renderRecord();
}

function pickProductType(el) {
  var grid = document.getElementById('modalProdTypeGrid');
  if (grid) {
    var items = grid.getElementsByClassName('prod-type');
    for (var i = 0; i < items.length; i++) items[i].className = 'prod-type';
  }
  el.className = 'prod-type selected';
  var inp = document.getElementById('modalProdType');
  if (inp) inp.value = el.getAttribute('data-type');
}

function showAddProductModal() {
  var typeHtml = '<input type="hidden" name="prodType" id="modalProdType" value="napkin">' +
    '<div class="prod-type-grid" id="modalProdTypeGrid">';
  for (var i = 0; i < PRODUCT_TYPES.length; i++) {
    var t = PRODUCT_TYPES[i];
    typeHtml += '<div class="prod-type' + (i === 0 ? ' selected' : '') + '" data-type="' + t.key + '" onclick="pickProductType(this)">' + t.label + '</div>';
  }
  typeHtml += '</div>';

  showModal({
    title: '添加自定义用品',
    body: '<div class="form-group" style="margin:0 0 14px"><div class="form-label">名称</div>' +
      '<input type="text" class="form-input" name="prodName" id="modalProdName" placeholder="例如：260mm、月经杯、液体卫生巾" maxlength="10"></div>' +
      '<div class="form-label">归入哪类统计</div>' + typeHtml +
      '<div style="font-size:12px;color:var(--text-tertiary);margin-top:10px">添加后会出现在「选择用品」里，以后记录可直接点选</div>',
    confirmText: '添加',
    onConfirm: function(vals) {
      var name = (vals.prodName || '').trim();
      if (!name) { showToast('请输入用品名称'); return; }
      if (name.length > 10) { showToast('名称请控制在 10 个字以内'); return; }
      var np = addCustomProduct(name, vals.prodType || 'napkin');

function saveChange(isEdit) {

  if (!state.selectedBleeding) { showToast('请选择出血量'); return; }
  var dateEl = document.getElementById('recDate');
  var timeEl = document.getElementById('recTime');
  var noteEl = document.getElementById('recNote');
  if (!dateEl || !timeEl) return;
  var date = dateEl.value;

  if (isEdit && state.editingCycleId && state.editingChangeId) {
    // Update existing record
    updateChange(state.editingCycleId, state.editingChangeId, data);

    showToast('✓ 已更新');
    var backCycleId = state.editingCycleId;
    cancelEdit(true);
    nav('dayDetail', {cycleId: backCycleId, date: date});

    var cycle = getCurrentCycle();
    if (!cycle) return;
    addChange(cycle.id, data);
    vibrate();
    showToast('✓ 已保存');
    nav('home');
  }
}

function cancelEdit(skipNav) {
  var backCycleId = state.editingCycleId;
  var editChange = (backCycleId && state.editingChangeId) ? getChangeById(backCycleId, state.editingChangeId) : null;
  var backDate = editChange ? editChange.date : null;
  state.editingCycleId = null;
  state.editingChangeId = null;
  state.selectedProduct = null;
  state.selectedBleeding = null;
  if (!skipNav) {
    if (backCycleId && backDate) {
      nav('dayDetail', {cycleId: backCycleId, date: backDate});
