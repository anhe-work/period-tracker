      nav('home');
    }
  }
}


/* ===== Symptoms Page ===== */
function renderSymptoms(params) {
  params = params || {};
  var el = document.getElementById('page-symptoms');
  var editIndex = (typeof params.editIndex === 'number' && params.editIndex >= 0) ? params.editIndex : -1;
  var date;
  if (editIndex >= 0 && params.date) {
    date = params.date;
    state.editingSymptomIndex = editIndex;
    state.symptomsDate = date;
  } else {
    date = params.date || state.symptomsDate || todayStr();
    state.symptomsDate = date;
    state.editingSymptomIndex = -1;
  }
  var entries = getDaySymptoms(date);
  var cur = (editIndex >= 0 && entries[editIndex]) ? entries[editIndex] : null;
  state.selectedSymptomsArr = cur ? (cur.selected || []).slice() : [];

  // 列出当日已有的症状记录（可编辑 / 删除）
  var listHtml = '';
  if (entries.length > 0) {
    listHtml += '<div class="card"><div class="card-title">📋 当日已有记录（' + entries.length + ' 条）</div>';
    for (var ei = 0; ei < entries.length; ei++) {
      var ent = entries[ei];
      var lblHtml = '';
      if (ent.selected) {
        for (var li = 0; li < ent.selected.length; li++) {
          var sl = getSymptomById(ent.selected[li]);
          lblHtml += '<span class="day-stat" style="background:#E3F2FD;color:#1565C0">' + (sl ? sl.label : '已删除的症状') + '</span>';
        }
      }
      var cstHtml = (ent.custom && ent.custom.trim() !== '') ? '<div style="font-size:13px;color:#666;margin-top:4px">' + ent.custom + '</div>' : '';
      listHtml += '<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0">' +
        '<div style="flex:1">' + lblHtml + cstHtml + (lblHtml === '' && cstHtml === '' ? '<span style="color:#bbb;font-size:13px">空记录</span>' : '') + '</div>' +
        '<button style="border:none;background:#FCEEF1;color:#C94B63;border-radius:6px;width:32px;height:32px;font-size:15px;flex-shrink:0" onclick="editSymptomEntry(\'' + date + '\',' + ei + ')">✎</button>' +
        '<button style="border:none;background:#FFEBEE;color:#D32F2F;border-radius:6px;width:32px;height:32px;font-size:15px;flex-shrink:0" onclick="confirmDeleteSymptomEntry(\'\',\'' + date + '\',' + ei + ')">✕</button>' +
        '</div>';
    }
    listHtml += '</div>';
  }

  // 录入表单：编辑模式预填，新增模式清空（按大类分组，图标网格选择）
  var isEdit = (editIndex >= 0);
  var formCustom = cur ? (cur.custom || '') : '';
  var allSyms = getAllSymptoms();

  var groupsHtml = '';
  for (var gi = 0; gi < SYMPTOM_GROUPS.length; gi++) {
    var grp = SYMPTOM_GROUPS[gi];
    var items = [];
    for (var si = 0; si < allSyms.length; si++) {
      var s0 = allSyms[si];
      if ((s0.group || 'body') !== grp.key) continue;
      // 退役项（如已拆分的「腹泻便秘」）不进选择器；但若旧记录里勾过，仍显示以便查看/取消
      if (s0.retired && !arrayContains(state.selectedSymptomsArr, s0.id)) continue;
      items.push(s0);
    }
    var isMore = (grp.key === 'more');
    if (items.length === 0 && !isMore) continue;

    var cells = '';
    for (var ci = 0; ci < items.length; ci++) {
      var s = items[ci];
      var checked = arrayContains(state.selectedSymptomsArr, s.id);
      // 只有用户自建项才可删除（内置补充项如肛门坠胀/长痘不可删）
      var delBtn = (isMore && state.editingSymptoms && s.custom) ?
        '<span class="sym-del" onclick="event.stopPropagation();confirmDeleteCustomSymptom(\'' + s.id + '\')">✕</span>' : '';
      cells += '<div class="sym-cell' + (checked ? ' selected' : '') + '" data-symptom="' + s.id + '" onclick="toggleSymptom(this,\'' + s.id + '\')">' +
        delBtn +
        '<span class="sym-ico' + (s.custom ? ' sym-ico-custom' : '') + '">' + (s.icon || '✚') + '</span>' +
        '<span class="sym-lbl">' + s.label + '</span>' +
        '</div>';
    }
    if (isMore) {
      cells += '<div class="sym-cell sym-add" onclick="showAddSymptomModal()">' +
        '<span class="sym-ico">＋</span><span class="sym-lbl">添加症状</span></div>';
    }

    var editBtn = isMore ?
      '<span class="sym-edit-btn" onclick="toggleEditSymptoms()">' + (state.editingSymptoms ? '完成' : '编辑') + '</span>' : '';
    var emptyTip = (isMore && items.length === 0 && !state.editingSymptoms) ?
      '<div class="sym-empty-tip">没有想记的？点「添加症状」自己建一个</div>' : '';

    groupsHtml += '<div class="card">' +
      '<div class="card-title sym-group-head"><span>' + grp.icon + ' ' + grp.label + '</span>' + editBtn + '</div>' +
      emptyTip +
      '<div class="sym-grid">' + cells + '</div></div>';
  }

  var formTitle = isEdit ? '✏️ 编辑症状记录' : '➕ 新增症状记录';
  var saveLabel = isEdit ? '更新症状' : '保存症状';
  var cancelBtn = isEdit ? '<button class="btn btn-secondary" style="flex:1" onclick="cancelEditSymptom()">取消</button>' : '';

  el.innerHTML = listHtml +
    '<div style="text-align:center;font-size:12px;color:var(--text-tertiary);margin:0 4px 10px">白带、胸涨、情绪等随时可记，不需要先有出血</div>' +
    '<div class="card"><div class="card-title">📅 日期</div>' +
    '<input type="text" class="form-input picker-input" id="symDate" value="' + date + '" readonly onclick="showDatePicker({current:this.value,onConfirm:function(v){document.getElementById(\'symDate\').value=v; state.symptomsDate=v; state.editingSymptomIndex=-1; state.editingSymptomCycleId=null; renderSymptoms();}})"></div>' +
    '<div class="section-title">' + formTitle + '</div>' +
    groupsHtml +
    '<div class="card"><div class="card-title">📝 补充说明（可选）</div>' +
    '<textarea class="form-input" id="symCustom" placeholder="记录今日身体其他感受...">' + formCustom + '</textarea></div>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn btn-primary" style="flex:1" onclick="saveSymptomsData()">' + saveLabel + '</button>' + cancelBtn + '</div>';

  var dateEl = document.getElementById('symDate');
  if (dateEl) {
    dateEl.onchange = function() {
      state.symptomsDate = this.value;
      renderSymptoms();
    };
  }
}

/* 有序周期 id 列表：只含真实月经周期（异常出血不计入），按开始日期升序。
   用于「本周期每日」页左右切换上一个 / 下一个周期。 */
function getOrderedPeriodIds() {
  var cls = classifyCycles();
  var arr = [];
  for (var i = 0; i < state.data.cycles.length; i++) {
    var c = state.data.cycles[i];
    if (cls[c.id] && cls[c.id] !== 'period') continue;
    arr.push(c);
  }
  arr.sort(function(a, b) { return a.startDate < b.startDate ? -1 : (a.startDate > b.startDate ? 1 : 0); });
  var ids = [];
  for (var j = 0; j < arr.length; j++) ids.push(arr[j].id);
  return ids;
}

/* 切换到上一个 / 下一个周期：替换当前页，不叠加返回层级（返回仍回上一层） */
function switchCycle(cycleId) {
  if (!cycleId) return;
  navigateTo('cycleDaily', {cycleId: cycleId});
}

/* ===== Cycle Daily Page ===== */
function renderCycleDaily(params) {
  params = params || {};
  var el = document.getElementById('page-cycleDaily');
  var cycle = params.cycleId ? getCycleById(params.cycleId) : getCurrentCycle();
  if (!cycle) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">没有找到周期</div></div>';
    return;
  }
  var dates = getDateRange(cycle);
  // reverse: newest first
  var revDates = [];
  for (var i = dates.length - 1; i >= 0; i--) revDates.push(dates[i]);
  var ongoing = !cycle.endDate;
  var stats = getCycleStats(cycle.id);

  // 上一个 / 下一个周期（左右切换）
  var orderedIds = getOrderedPeriodIds();
  var curIdx = -1;
  for (var oi = 0; oi < orderedIds.length; oi++) {
    if (orderedIds[oi] === cycle.id) { curIdx = oi; break; }
  }
  if (curIdx < 0) {
    // 当前周期不在真实月经周期列表里（例如异常出血周期）：退化为全部周期按时间排序
    var allSorted = state.data.cycles.slice().sort(function(a, b) {
      return a.startDate < b.startDate ? -1 : (a.startDate > b.startDate ? 1 : 0);
    });
    orderedIds = [];
    for (var ai = 0; ai < allSorted.length; ai++) orderedIds.push(allSorted[ai].id);
    for (var aj = 0; aj < orderedIds.length; aj++) {
      if (orderedIds[aj] === cycle.id) { curIdx = aj; break; }
    }
  }
  var prevCycleId = curIdx > 0 ? orderedIds[curIdx - 1] : '';
  var nextCycleId = (curIdx >= 0 && curIdx < orderedIds.length - 1) ? orderedIds[curIdx + 1] : '';
  var prevBtn = '<div class="cycle-switch-btn' + (prevCycleId ? '' : ' disabled') + '"' +
    (prevCycleId ? ' title="上一个周期" onclick="switchCycle(\'' + prevCycleId + '\')"' : '') + '>&#8249;</div>';
  var nextBtn = '<div class="cycle-switch-btn' + (nextCycleId ? '' : ' disabled') + '"' +
    (nextCycleId ? ' title="下一个周期" onclick="switchCycle(\'' + nextCycleId + '\')"' : '') + '>&#8250;</div>';

  var html = '<div class="card"><div class="cycle-info">' +
    '<div style="display:flex;align-items:center;gap:6px">' + prevBtn +
    '<div style="flex:1;min-width:0">' +
    '<div style="font-size:16px;font-weight:600">' + formatDateFull(cycle.startDate) +
    (cycle.endDate ? ' ~ ' + formatDate(cycle.endDate) : ' ～ 进行中') + '</div>' +
    '<div class="cycle-day-count" style="margin-top:4px">共 ' + dates.length + ' 天</div>' +
    '</div>' + nextBtn + '</div>' +
    '<div style="margin-top:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">' +
    '<span class="day-stat" style="background:#FFE5E9;color:#C94B63">卫生巾 ' + stats.napkin + '</span>' +
    '<span class="day-stat" style="background:#FCEEF1;color:#E8657A">护垫 ' + stats.pad + '</span>' +
    '<span class="day-stat" style="background:#F3E5F5;color:#8E24AA">棉条 ' + stats.tampon + '</span>' +
    '<span class="day-stat" style="background:#E8F5E9;color:#2E7D32">安睡裤 ' + stats.pants + '</span>' +
    '</div></div></div>';

  if (ongoing) {
    html += '<button class="btn btn-primary" style="margin-bottom:12px" onclick="showEndCycleModal(\'' + cycle.id + '\')">✓ 结束本期</button>';
  } else {
    html += '<div class="predict-card" style="margin-bottom:12px;text-align:center">' +
      '<div style="font-size:14px;color:var(--text-secondary)">此周期已结束 · 持续 ' + dates.length + ' 天</div>' +
      '<button class="btn btn-secondary" style="margin:10px auto 0;max-width:260px" onclick="reopenAndGo(\'' + cycle.id + '\')">重新打开此周期，继续记录</button>' +
      '</div>';
  }

  html += '<div class="section-title">📅 每日记录</div>';

  for (var di = 0; di < revDates.length; di++) {
    var d = revDates[di];
    var dStats = getDayStats(cycle.id, d);
    var hasRecords = dStats.changes.length > 0;
    var sym = getDaySymptoms(d);
    var statChips = '';
    if (hasRecords) {
      if (dStats.napkin > 0) statChips += '<span class="day-stat" style="background:#FFE5E9;color:#C94B63">卫生巾 ' + dStats.napkin + '</span>';
      if (dStats.pad > 0) statChips += '<span class="day-stat" style="background:#FCEEF1;color:#E8657A">护垫 ' + dStats.pad + '</span>';
      if (dStats.tampon > 0) statChips += '<span class="day-stat" style="background:#F3E5F5;color:#8E24AA">棉条 ' + dStats.tampon + '</span>';
      if (dStats.pants > 0) statChips += '<span class="day-stat" style="background:#E8F5E9;color:#2E7D32">安睡裤 ' + dStats.pants + '</span>';
    }
    var symChip = '';
    if (sym && sym.length > 0) {
      var symCnt = 0;
      for (var ki = 0; ki < sym.length; ki++) {
        var ek = sym[ki];
        if ((ek.selected && ek.selected.length > 0) || (ek.custom && ek.custom.trim() !== '')) symCnt++;
      }
      if (symCnt > 0) symChip = '<span class="day-stat" style="background:#E3F2FD;color:#1565C0">症状 ' + symCnt + '</span>';
    }
    var todayStyle = isToday(d) ? ' style="border:2px solid #E8657A"' : '';
    var dayLabel = formatDate(d) + (isToday(d) ? '（今天）' : '') + ' ' + getWeekday(d);

    html += '<div class="day-card"' + todayStyle + ' onclick="nav(\'dayDetail\',{cycleId:\'' + cycle.id + '\',date:\'' + d + '\'})">' +
      '<div class="day-card-header"><div class="day-label">' + dayLabel + '</div>' +
      '<div style="font-size:12px;color:#999">' + dStats.changes.length + ' 次更换</div></div>' +
      '<div class="day-stats-row">' + statChips + symChip +
      ((hasRecords || symChip) ? '' : '<span style="font-size:13px;color:#bbb">无记录</span>') + '</div></div>';
  }

  el.innerHTML = html;
}

function generateBackup() {
  try {
    var json = JSON.stringify(state.data);
    // Use btoa for ASCII-safe encoding
    var b64 = btoa(unescape(encodeURIComponent(json)));
    var backup = 'PERIOD_BACKUP_V1:' + b64;
    var ta = document.getElementById('exportText');
    if (ta) ta.value = backup;
    showToast('✓ 备份文本已生成');
  } catch (e) {
    showToast('生成失败: ' + e.message);
  }
}

function copyBackup() {
  var ta = document.getElementById('exportText');
  if (!ta) return;
  var text = ta.value;
  if (!text) { showToast('请先生成备份文本'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('✓ 已复制到剪贴板');
      }).catch(function() {
        fallbackCopy(ta);
      });
    } else {
      fallbackCopy(ta);
    }
  } catch (e) {
    fallbackCopy(ta);
  }
}

function fallbackCopy(ta) {
  try {
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    showToast(ok ? '✓ 已复制' : '复制失败，请手动复制');
  } catch (e) {
    showToast('复制失败，请手动复制');
  }
}

function downloadBackup() {
  var ta = document.getElementById('exportText');
  if (!ta) return;
  var text = ta.value;
  if (!text) { showToast('请先生成备份文本'); return; }
  try {
    var blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'period_backup.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    showToast('✓ 已下载');
  } catch (e) {
    showToast('下载失败: ' + e.message);
  }
}

function importBackup() {
  var ta = document.getElementById('importText');
  if (!ta) return;
  var text = ta.value.trim();
  if (!text) { showToast('请先粘贴备份文本'); return; }
  try {
    var jsonStr;
    if (text.indexOf('PERIOD_BACKUP_V1:') === 0) {
      var b64 = text.substring('PERIOD_BACKUP_V1:'.length);
      jsonStr = decodeURIComponent(escape(atob(b64)));
    } else {
      jsonStr = text;
    }
    var data = JSON.parse(jsonStr);
    var count = (data && data.cycles) ? data.cycles.length : 0;
    showModal({
      title: '确认恢复',
      body: '检测到 ' + count + ' 个周期的数据。<br>恢复将<strong style="color:#E53935">替换</strong>当前所有数据，是否继续？',
      confirmText: '确认恢复',
      onConfirm: function() {
        state.data = data;
        normalizeData();
        saveData();
        vibrate();
        showToast('✓ 数据已恢复');
        nav('home');
      }
    });
  } catch (e) {
    showToast('备份文本格式错误: ' + e.message);
  }
}

function exportToJSONFile() {
  var json = JSON.stringify(state.data, null, 2);
  var date = new Date();
  var y = date.getFullYear();
  var m = String(date.getMonth() + 1);
  if (m.length < 2) m = '0' + m;
  var d = String(date.getDate());
  if (d.length < 2) d = '0' + d;
  var h = String(date.getHours());
  if (h.length < 2) h = '0' + h;
  var min = String(date.getMinutes());
  if (min.length < 2) min = '0' + min;
  var filename = '经期记录_' + y + '-' + m + '-' + d + '_' + h + '-' + min + '.json';

  var isNative = (typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

  if (isNative && Capacitor.Plugins.JsonExport) {
    // Native: show options dialog (uses native JsonExport plugin)
    showExportDialog(filename, json);
  } else {
    // Web: direct download
    webDownloadJson(filename, json);
  }

  // ===== Export options bottom sheet =====
  function showExportDialog(fname, fcontent) {
    // Remove any existing dialog
    var existing = document.getElementById('export-dialog-overlay');
    if (existing) existing.remove();

    var overlay = document.createElement('div');
    overlay.id = 'export-dialog-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:99999;display:flex;align-items:flex-end;justify-content:center;transition:opacity 0.2s;';

    var sheet = document.createElement('div');
    sheet.style.cssText = 'background:#fff;width:100%;max-width:500px;border-radius:16px 16px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,0.1);';

    // Title
    var title = document.createElement('div');
    title.style.cssText = 'font-size:18px;font-weight:600;color:#333;text-align:center;margin-bottom:6px;';
    title.textContent = '导出JSON文件';
    sheet.appendChild(title);

    var subtitle = document.createElement('div');
    subtitle.style.cssText = 'font-size:13px;color:#999;text-align:center;margin-bottom:20px;word-break:break-all;';
    subtitle.textContent = fname;
    sheet.appendChild(subtitle);

    // Option 1: Share via system share panel (WeChat, QQ, etc.)
    var btnShare = document.createElement('button');
    btnShare.style.cssText = 'width:100%;padding:15px;margin-bottom:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#E8657A,#F0909E);color:#fff;font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;';
    btnShare.innerHTML = '<span>📤 分享给好友（微信/QQ等）</span>';
    btnShare.onclick = function() {
      overlay.remove();
      Capacitor.Plugins.JsonExport.share({
        filename: fname,
        content: fcontent
      }).then(function() {
        showToast('已打开分享面板');
      }).catch(function() {
        webDownloadJson(fname, fcontent);
      });
    };
    sheet.appendChild(btnShare);

    // Option 2: Save to phone Downloads folder
    var btnSave = document.createElement('button');
    btnSave.style.cssText = 'width:100%;padding:15px;margin-bottom:12px;border:2px solid #E8657A;border-radius:12px;background:#fff;color:#E8657A;font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;';
    btnSave.innerHTML = '<span>💾 保存到手机</span>';
    btnSave.onclick = function() {
      overlay.remove();
      showToast('正在打开文件管理器...');
      Capacitor.Plugins.JsonExport.saveAs({
        filename: fname,
        content: fcontent
      }).then(function(result) {
        var path = (result && result.path) ? result.path : '';
        if (path && path.indexOf('%2F') !== -1) {
          path = decodeURIComponent(path.replace(/\+/g, ' '));
        }
        showToast('已保存到：' + path);
      }).catch(function(err) {
        var msg = (err && err.message) ? err.message : '';
        if (msg.indexOf('canceled') !== -1) { return; }
        showToast('保存失败: ' + msg);
        webDownloadJson(fname, fcontent);
      });
    };
    sheet.appendChild(btnSave);

    // Cancel button
    var btnCancel = document.createElement('button');
    btnCancel.style.cssText = 'width:100%;padding:15px;border:none;border-radius:12px;background:#f5f5f5;color:#666;font-size:16px;cursor:pointer;';
    btnCancel.textContent = '取消';
    btnCancel.onclick = function() { overlay.remove(); };
    sheet.appendChild(btnCancel);

    overlay.appendChild(sheet);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  // ===== Write JSON to cache then open share panel =====
  function writeAndShare(fname, fcontent) {
    try {
      var Filesystem = Capacitor.Plugins.Filesystem;
      var Share = Capacitor.Plugins.Share;
      if (!Filesystem || !Filesystem.writeFile) {
        fallbackShare(fname, fcontent);
        return;
      }
      // 先把 JSON 写成文件，再通过 Share 把"文件"附上（这样微信/QQ 才能收到真正的数据）
      Filesystem.writeFile({
        path: 'period_export/' + fname,
        data: fcontent,
        directory: 'DOCUMENTS',
        encoding: 'utf8',
        recursive: true
      }).then(function(res) {
        var uri = res && res.uri ? res.uri : null;
        if (Share && Share.share && uri) {
          return Share.share({
            title: fname,
            text: '经期记录备份数据',
            files: [uri]
          }).then(function() {
            showToast('已打开分享面板，可发送到微信/QQ');
          }).catch(function(err) {
            console.log('Share fallback:', err);
            fallbackShare(fname, fcontent);
          });
        } else {
          fallbackShare(fname, fcontent);
        }
      }).catch(function(err) {
        console.log('Write for share failed:', err);
        fallbackShare(fname, fcontent);
      });
    } catch(e) {
      fallbackShare(fname, fcontent);
    }
  }

  // ===== Fallback: copy JSON to clipboard + show toast =====
  function fallbackShare(fname, fcontent) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fcontent).then(function() {
        showToast('✓ 数据已复制到剪贴板，请打开微信粘贴发送');
      }).catch(function() {
        showToast('分享失败，请重试');
      });
    } else {
      showToast('当前环境不支持分享');
    }
  }

  // ===== Save to phone via Filesystem plugin =====
  function saveToFile(fname, fcontent) {
    try {
      var Filesystem = Capacitor.Plugins.Filesystem;
      if (Filesystem && Filesystem.writeFile) {
        // Try to write to external storage (Downloads-like location)
        Filesystem.writeFile({
          path: 'Download/' + fname,
          data: fcontent,
          directory: 'EXTERNAL_STORAGE',
          encoding: 'utf8',
          recursive: true
        }).then(function(result) {
          showToast('✓ 已保存到 Download/' + fname);
        }).catch(function(err) {
          // Fallback: try cache or documents directory
          Filesystem.writeFile({
            path: fname,
            data: fcontent,
            directory: 'DOCUMENTS',
            encoding: 'utf8'
          }).then(function() {
            showToast('✓ 已保存到文档目录: ' + fname);
          }).catch(function(err2) {
            console.log('Filesystem save error:', err2);
            showToast('保存失败: ' + (err2.message || '未知错误'));
          });
        });
      } else {
        showToast('文件系统插件不可用');
      }
    } catch(e) {
      showToast('保存失败: ' + e.message);
    }
  }

  // ===== Web download (browser fallback) =====
  function webDownloadJson(fname, fcontent) {
    try {
      var blob = new Blob([fcontent], {type: 'application/json;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      showToast('已导出: ' + fname);
    } catch (e) {
      showToast('导出失败: ' + e.message);
    }
  }
}

function importFromFile() {
  var input = document.getElementById('importFileInput');
  if (!input) return;
  input.value = '';
  input.click();
}

function handleImportFile(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var content = e.target.result;
      var data = JSON.parse(content);
      var count = (data && data.cycles) ? data.cycles.length : 0;
      showModal({
        title: '确认恢复',
        body: '检测到 ' + count + ' 个周期的数据。<br>恢复将<strong style="color:#E53935">替换</strong>当前所有数据，是否继续？',
        confirmText: '确认恢复',
        onConfirm: function() {
          state.data = data;
          saveData();
          vibrate();
          showToast('✓ 数据已恢复');
          nav('home');
        }
      });
    } catch (err) {
      showToast('文件格式错误: ' + err.message);
    }
  };
  reader.onerror = function() {
    showToast('读取文件失败');
  };
  reader.readAsText(file);
}

function confirmClearAll() {
  showModal({
    title: '清除所有数据',
    body: '<strong style="color:#E53935">警告</strong>：这将永久删除所有周期记录、更换记录和症状数据，且不可撤销！<br><br>建议先导出备份再清除。',
    confirmText: '确认清除',
    danger: true,
    onConfirm: function() {
      state.data = {cycles: []};
      saveData();
      vibrate();
      showToast('所有数据已清除');
      nav('home');
    }
  });
}

/* ===== Modals ===== */
function showStartCycleModal() {
  showModal({
    title: '记录出血',
    body:
      '<div class="form-group" style="margin:0"><div class="form-label">这次出血从哪天开始？</div>' +
      '<input type="text" class="form-input picker-input" name="startDate" id="modalStartDate" value="' + todayStr() + '" readonly onclick="showDatePicker({current:this.value,onConfirm:function(v){document.getElementById(\'modalStartDate\').value=v}})"></div>',
    confirmText: '开始记录',
    onConfirm: function(vals) {
      if (!vals.startDate) { showToast('请选择日期'); return; }
      createCycle(vals.startDate);
      vibrate();
      showToast('✓ 已开始记录');
      nav('home');
    }
  });
}

function reopenLastEnded() {
  var last = getLastEndedCycle();
  if (!last) { showToast('没有找到可恢复的周期'); return; }
  reopenCycle(last.id);
  vibrate();
  showToast('✓ 周期已重新打开，可以继续记录');
  nav('home');
}

function reopenAndGo(cycleId) {
  reopenCycle(cycleId);
  vibrate();
  showToast('✓ 周期已重新打开，可以继续记录');
  nav('cycleDaily', {cycleId: cycleId});
}

function showEndCycleModal(cycleId) {
  var cycle = getCycleById(cycleId);
  if (!cycle) return;
  showModal({
    title: '结束本期',
    body: '<div style="margin-bottom:10px;font-size:14px;color:var(--text-secondary);text-align:center">确定本次经期已经结束了吗？<br>结束后将无法继续记录更换。<br>如果误触了，确认后可以立即撤销。</div>' +
      '<div class="form-group" style="margin:0"><div class="form-label">经期结束日期</div>' +
      '<input type="text" class="form-input picker-input" name="endDate" id="modalEndDate" value="' + todayStr() + '" readonly onclick="showDatePicker({current:this.value,onConfirm:function(v){document.getElementById(\'modalEndDate\').value=v}})"></div>',
    confirmText: '确认结束',
    onConfirm: function(vals) {
      if (!vals.endDate) { showToast('请选择日期'); return; }
      if (vals.endDate < cycle.startDate) { showToast('结束日期不能早于开始日期'); return; }
      var oldEndDate = cycle.endDate;
      endCycle(cycleId, vals.endDate);
      vibrate();
      showUndoToast('✓ 本期已结束', '撤销', function() {
        // Undo: reopen the cycle
        reopenCycle(cycleId);
        vibrate();
        showToast('✓ 已撤销，周期已恢复');
        nav('home');
      });
      nav('home');
    }
  });
}

/* ===== Init ===== */
function init() {
  try {
    // Check localStorage first
    checkStorage();
    loadData();

    // Init calendar state
    var now = new Date();
    state.calendarYear = now.getFullYear();
    state.calendarMonth = now.getMonth();

    // Confirm JS is running - replace static loading content
    var home = document.getElementById('page-home');
    if (home) {
      home.setAttribute('data-js-loaded', 'v3');
    }

    // Bind modal overlay
    var mo = document.getElementById('modalOverlay');
    if (mo) {
      mo.onclick = function(e) {
        if (e.target === mo) hideModal();
      };
    }

    // Show storage warning if unavailable
    if (!LOCALSTORAGE_AVAILABLE) {
      if (home) {
        home.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#E53935">' +
          '<div style="font-size:48px">⚠️</div>' +
          '<div style="margin-top:16px;font-size:16px;font-weight:600">本地存储不可用</div>' +
          '<div style="margin-top:8px;font-size:13px;color:#666;line-height:1.8">您的浏览器禁用了本地存储（localStorage），应用需要存储功能来保存数据。<br><br>请尝试：<br>1. 关闭无痕/隐私模式<br>2. 在浏览器设置中允许网站数据<br>3. 使用Chrome/Safari等标准浏览器打开</div>' +
          '<button class="btn btn-primary" style="margin-top:20px;max-width:200px" onclick="location.reload()">刷新重试</button>' +
          '</div>';
        return;
      }
    }

    navigateTo('home');
  } catch (e) {
    showError('初始化错误: ' + e.message);
  }
}

// Run init
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

/* ===== PWA Service Worker ===== */
/* 原生 App（安卓 APK）里网页资源本来就打包在本地，不需要 Service Worker；
   注册了反而会因 cache-first 在升级后继续显示旧界面，所以原生环境一律不注册。 */
var IS_NATIVE_APP = (typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
if (IS_NATIVE_APP) {
  clearPwaCache();
} else if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').then(function(reg) {
    console.log('SW registered: ' + reg.scope);
  }).catch(function(err) {
    console.log('SW registration failed: ' + err.message);
  });
}

/* ===== PWA Install Prompt ===== */
var PWA_INSTALL_PROMPT = null;
var PWA_INSTALL_SHOWN = false;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  PWA_INSTALL_PROMPT = e;
  if (!PWA_INSTALL_SHOWN) {
    showInstallBanner();
  }
});

function showInstallBanner() {
  if (PWA_INSTALL_SHOWN) return;
  PWA_INSTALL_SHOWN = true;
  var existing = document.getElementById('installBanner');
  if (existing) existing.parentNode.removeChild(existing);

  var banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.style.cssText = 'position:fixed;bottom:calc(var(--nav-h) + 8px);left:8px;right:8px;z-index:9998;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.15);padding:14px 16px;display:flex;align-items:center;gap:12px;animation:slideUp 0.3s ease;';
  banner.innerHTML = '<div style="flex:1"><div style="font-size:15px;font-weight:600;color:#2D2D2D">添加到主屏幕</div>' +
    '<div style="font-size:13px;color:#666;margin-top:2px">像原生App一样使用，离线也能打开</div></div>' +
    '<button id="installBtn" style="background:var(--primary-gradient);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;">安装</button>' +
    '<button onclick="hideInstallBanner()" style="background:none;border:none;font-size:20px;color:#999;cursor:pointer;padding:0 4px;flex-shrink:0;">&times;</button>';
  document.body.appendChild(banner);

  document.getElementById('installBtn').onclick = function() {
    if (PWA_INSTALL_PROMPT) {
      PWA_INSTALL_PROMPT.prompt();
      PWA_INSTALL_PROMPT.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          console.log('PWA installed');
        }
        PWA_INSTALL_PROMPT = null;
      });
    } else {
      showToast('iOS用户：请用 Safari 打开，点击"分享"→"添加到主屏幕"');
    }
    hideInstallBanner();
  };
}

function hideInstallBanner() {
  var banner = document.getElementById('installBanner');
  if (banner) {
    banner.style.animation = 'slideDown 0.2s ease forwards';
    setTimeout(function() { banner.parentNode.removeChild(banner); }, 200);
  }
}

/* ===== Handle iOS standalone / shortcut navigation ===== */
window.addEventListener('load', function() {
  // Handle shortcut deep links
  var url = new URL(window.location.href);
  var source = url.searchParams.get('source');
  if (source === 'shortcut_record') {
    navigateTo('record');
  } else if (source === 'shortcut_symptoms') {
    navigateTo('symptoms');
  }
});

/* ===== iOS Standalone Detection ===== */
function isIOSStandalone() {
  return window.navigator.standalone === true;
}
function isDisplayStandalone() {
  return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
}
</script>
